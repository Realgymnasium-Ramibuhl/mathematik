<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Der Silbersee – Kreisberechnung im Wilden Westen</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#ecdcb4;--ink:#2b1d12;--wood:#6b4423;--brass:#c28b2c;--red:#8c2f1b;--ok:#2f6b32;--soft:#d8c391;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#3a2b1c;--ink:#f0e2c4;--wood:#a8744a;--brass:#e0a63e;--red:#e0765c;--ok:#7bc47f;--soft:#4b3924}}
:root[data-theme="dark"]{--paper:#3a2b1c;--ink:#f0e2c4;--wood:#a8744a;--brass:#e0a63e;--red:#e0765c;--ok:#7bc47f;--soft:#4b3924}
html,body{height:100%;margin:0}
body{background:#2b1d12;color:var(--ink);font:17px/1.4 "Alegreya Sans",Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
h2{font:400 1.5rem/1.1 Rye,Georgia,serif;margin:0 0 .5rem;color:var(--red)}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:8px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto;color:var(--ink);background:var(--paper);border:3px solid var(--wood);border-radius:8px;padding:4px 12px;font-weight:700}
#hud .sp{flex:1;background:none;border:0}
#inv{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 60px);display:flex;flex-direction:column;gap:4px;pointer-events:none}
#inv span{background:var(--paper);border:2px solid var(--wood);border-radius:8px;padding:0 6px;font-size:1.4rem;line-height:1.5}
.b{font:700 1rem "Alegreya Sans",Georgia,serif;background:var(--brass);color:#2b1d12;border:2px solid var(--wood);border-radius:8px;padding:7px 14px;cursor:pointer;margin:3px 4px 3px 0}
.b:hover{filter:brightness(1.1)}.b:disabled{opacity:.5;cursor:default}
.b.g{background:var(--soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);background:#ecdcb4ee;color:#2b1d12;border:2px solid #6b4423;border-radius:6px;padding:1px 8px;font-weight:700;font-size:.9rem;white-space:nowrap}
#pr{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--paper);border:3px solid var(--brass);border-radius:10px;padding:8px 18px;font-weight:700;display:none;cursor:pointer}
#pad{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:none;grid-template:repeat(3,64px)/repeat(3,64px);gap:6px}
#pad button{background:#ecdcb4cc;border:2px solid #6b4423;border-radius:10px;font-size:1.3rem;touch-action:none}
#ts{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:6px 16px;border-radius:8px;font-weight:700;display:none}
#pn{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0007;-webkit-user-select:text;user-select:text}
#pn.on{display:flex}
.card{background:var(--paper);border:5px solid var(--wood);border-radius:14px;padding:16px 20px;width:calc(100% - 24px);max-width:580px;max-height:92%;overflow:auto;box-shadow:0 8px 30px #000a}
.q{font:700 1.7rem Georgia,serif;text-align:center;margin:.6rem 0;color:var(--red)}
.it{display:flex;gap:10px;align-items:center;border-top:1px dashed var(--wood);padding:6px 0}.it>div{flex:1}.em{font-size:2rem}
input.t{width:100%;box-sizing:border-box;font:1.4rem Georgia,serif;padding:8px;border:3px solid var(--wood);border-radius:8px;background:#fffaf0;color:#2b1d12}
.kp button{min-width:38px;font-size:1.1rem;padding:6px 8px}
#fb{min-height:1.4em;margin:.4rem 0;font-weight:700}.bad{color:var(--red)}.good{color:var(--ok)}
small{opacity:.85}
@media (max-width:600px){.card{padding:12px}.q{font-size:1.4rem}}
</style></head>
<body><div id="app">
<canvas id="c"></canvas><div id="lbls"></div>
<div id="hud" hidden><span id="nm"></span><span id="mo"></span><span class="sp"></span><button class="b g" id="snb" onclick="G.snd()">🔇 Ton aus</button><button class="b g" id="fxb" onclick="G.fx()">✨ Effekte an</button><button class="b" onclick="G.bag()">🎒 Rucksack</button></div>
<div id="inv"></div><div id="pr" onclick="G.act()"></div><div id="ts"></div>
<div id="pad"><i></i><button data-k="arrowup">▲</button><i></i><button data-k="arrowleft">◀</button><i></i><button data-k="arrowright">▶</button><i></i><button data-k="arrowdown">▼</button><i></i></div>
<div id="pn"><div class="card" id="cd"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ================= 1. ZAHLEN-PRÜFUNG (Kreisberechnung) ================= */
const PI=Math.PI;
// Eingabe lesen: "12π", "3,5·π", "π", "12,57 cm" -> {c:Zahl, pi:mit π?}
function rd(s){s=String(s).replace(/\s/g,'').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/pi/gi,'π').replace(/[·*]/g,'').replace(/(cm|mm|dm|km|m|°|grad)$/i,'');
 if(!s)throw'Bitte gib eine Zahl ein.';
 const m=s.match(/^(-?)(\d*\.?\d*)(π?)$/);
 if(!m||(m[2]===''&&!m[3])||m[2]==='.')throw'Das lässt sich nicht als Zahl lesen. Nutze Ziffern, Komma und π.';
 let c=m[2]===''?1:parseFloat(m[2]);if(m[1])c=-c;return{c,pi:!!m[3]}}
const val=x=>x.pi?x.c*PI:x.c;
// T.mode 'pi': exakte Antwort als Vielfaches von π (T.target = Zahl vor π). T.mode 'dec': gerundet auf T.dp Stellen (T.target = Wert).
function check(T,inp){let x;try{x=rd(inp)}catch(e){return{ok:0,m:String(e),t:null}}
 const pm=T.mode=='pi',dp=T.dp??1;
 const ok=t=>pm?(x.pi?Math.abs(x.c-t)<1e-6:Math.abs(x.c-t*PI)<=.05+1e-3*Math.abs(t*PI)):Math.abs(val(x)-t)<=.6*10**-dp+7e-4*Math.abs(t);
 if(ok(T.target))return pm&&!x.pi?{ok:0,m:'Der Wert stimmt ungefähr. Verlangt ist aber die exakte Angabe als Vielfaches von π, zum Beispiel 12π.',t:'unf'}:{ok:1};
 for(const[t,m,c]of T.traps||[])if(ok(t))return{ok:0,m,t:c};
 const tv=pm?T.target*PI:T.target;
 if(Math.abs(val(x)-tv)<=.02*Math.abs(tv))return{ok:0,m:pm?'Nah dran. Prüfe die Zahl vor dem π.':`Nah dran. Runde auf ${dp==0?'ganze Zahlen':dp+' Dezimale(n)'} und rechne mit der π-Taste deines Taschenrechners.`,t:'einh'};
 return{ok:0,m:'Noch nicht richtig. Gehe die Rechnung Schritt für Schritt durch und prüfe die Formel.',t:'rech'}}

/* ================= 2. AUFGABEN-GENERATOREN ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const f=(x,d=2)=>String(+(+x).toFixed(d)).replace('.',','),pS=c=>(c==1?'':f(c))+'π';
const ERRL={form:'Falsche Formel (z. B. Fläche statt Umfang)',dr:'Radius und Durchmesser verwechselt',ring:'Kreisring: Rand oder Dicke falsch',sek:'Kreissektor: Winkelanteil oder Bogen falsch',einh:'Einheiten- oder Rundungsfehler',unf:'Angabe nicht in der verlangten Form',rech:'Rechenfehler'};
const mk=o=>{const m=o.mode||'dec',d=o.dp??1,cl=(a,b)=>m=='pi'?Math.abs(a-b)<1e-6:Math.abs(a-b)<=.6*10**-d+7e-4*Math.abs(b),tr=[];if(o.traps)for(const t of o.traps)if(!cl(t[0],o.target)&&!tr.some(u=>cl(u[0],t[0])))tr.push(t);return{kind:'num',mode:m,dp:d,...o,traps:o.traps?tr:o.traps,ins:o.ins||(m=='pi'?'Gib das Ergebnis exakt als Vielfaches von π an, zum Beispiel 12π oder 7,5π.':d==0?'Runde auf eine ganze Zahl. Rechne mit der π-Taste deines Taschenrechners.':`Runde auf ${d} Dezimale${d==1?'':'n'}. Rechne mit der π-Taste deines Taschenrechners.`)}};
const stub=id=>()=>{const r=R(2,12);return mk({story:`Platzhalter ${id}: Ein Rad hat den Radius ${r} cm. Wie gross ist der Umfang?`,q:'U = ? (in cm)',target:2*r,mode:'pi',ans:`${2*r}π cm`,traps:[[r,'Das ist der Radius, nicht der Umfang.','form']],hints:['U = 2·π·r.',`2·${r} = ${2*r}, also ${2*r}π.`]})};
const GEN={ // id:{t:Titel, r:Lohn, f:Generator}
1:{t:'Korralzaun',r:5,f(){const r=pick([3,4,5,6,7,8,9,10,12,15]);return mk({mode:'pi',story:`Der Korral des Farmers ist kreisrund und hat einen Radius von ${r} m. Wie lang ist der Zaun, der einmal ganz herum führt?`,q:'U = ? (in m)',target:2*r,ans:`${pS(2*r)} m`,traps:[[r,'Fast: Die Formel lautet U = 2·π·r. Der Faktor 2 fehlt (oder du hast mit d·π gerechnet, obwohl r gegeben ist).','dr'],[r*r,'Das ist die Fläche (π·r²), nicht der Umfang.','form']],hints:['Der Umfang eines Kreises: U = 2·π·r.',`2·${r} = ${2*r}, also U = ${pS(2*r)} m.`]})}},
2:{t:'Wagenrad messen',r:6,f(){const d=pick([40,50,60,70,80,90,100,120]);return mk({dp:1,story:`Ein Wagenrad hat einen Durchmesser von ${d} cm. Wie weit rollt der Wagen bei einer ganzen Umdrehung?`,q:'U = ? (in cm)',target:PI*d,ans:`${f(PI*d,1)} cm`,traps:[[2*PI*d,'Du hast den Durchmesser wie einen Radius behandelt. Mit d gilt U = π·d.','dr'],[PI*d/2,'Du hast halbiert, aber d ist schon der Durchmesser: U = π·d.','dr'],[PI*d*d/4,'Das ist die Fläche des Rades, nicht der Umfang.','form']],hints:['Mit dem Durchmesser: U = π·d.',`π·${d} ≈ ${f(PI*d,1)} cm.`]})}},
3:{t:'Brunnenrand',r:7,f(){const U=R(40,300);return mk({dp:1,story:`Der runde Rand des Dorfbrunnens ist ${U} cm lang (das ist der Umfang). Wie gross ist der Radius des Brunnens?`,q:'r = ? (in cm)',target:U/(2*PI),ans:`${f(U/(2*PI),1)} cm`,traps:[[U/PI,'Das ist der Durchmesser (U : π). Der Radius ist halb so gross.','dr'],[U/2,'Auch π gehört in die Rechnung: r = U : (2·π).','form']],hints:['Stelle U = 2·π·r nach r um: r = U : (2·π).',`${U} : (2·π) ≈ ${f(U/(2*PI),1)} cm.`]})}},
4:{t:'Fassreifen',r:7,f(){const U=pick([180,220,250,300,350,400,450]);return mk({dp:1,story:`Der Schmied biegt einen Eisenreifen von ${U} cm Länge zu einem Kreis, der eng um ein Fass liegt. Welchen Durchmesser hat das Fass?`,q:'d = ? (in cm)',target:U/PI,ans:`${f(U/PI,1)} cm`,traps:[[U/(2*PI),'Das ist der Radius. Gesucht ist der Durchmesser: d = U : π.','dr'],[U/2,'Teile durch π, nicht durch 2: d = U : π.','form']],hints:['Der Umfang ist U = π·d. Stelle nach d um.',`d = ${U} : π ≈ ${f(U/PI,1)} cm.`]})}},
5:{t:'Räder zählen',r:8,f(){const d=pick([60,70,80,90,100]),s=pick([50,80,120,200]);return mk({dp:1,story:`Ein Wagenrad hat einen Durchmesser von ${d} cm. Der Wagen fährt ${s} m weit. Wie oft dreht sich das Rad dabei?`,q:'Umdrehungen = ?',target:s*100/(PI*d),ans:`${f(s*100/(PI*d),1)} Umdrehungen`,traps:[[s*100/(2*PI*d),'Du hast d wie einen Radius behandelt. Der Umfang ist π·d.','dr'],[s/(PI*d),`Meter und Zentimeter passen nicht zusammen: ${s} m sind ${s*100} cm.`,'einh']],hints:['Rechne zuerst die Strecke in cm um und berechne den Umfang des Rades.',`Umfang ≈ ${f(PI*d,1)} cm, Strecke ${s*100} cm. Dann: Strecke : Umfang.`]})}},
6:{t:'Seil um den Pfosten',r:9,f(){const n=pick([2,3,4,5]),d=pick([8,10,12,15,20]),L=Math.round(n*PI*d);return mk({dp:1,story:`Ein ${L} cm langes Seil wird ${n}-mal eng um einen runden Pfosten gewickelt (ohne Überstand). Welchen Durchmesser hat der Pfosten?`,q:'d = ? (in cm)',target:L/(n*PI),ans:`${f(L/(n*PI),1)} cm`,traps:[[L/PI,`Das Seil geht ${n}-mal herum. Teile erst durch ${n}, um einen Umfang zu erhalten.`,'form'],[L/(2*n*PI),'Das ist der Radius. Gesucht ist der Durchmesser.','dr']],hints:[`Eine Windung ist ${n}-mal kürzer als das ganze Seil: Das ist der Umfang U.`,`U = ${L} : ${n}. Dann d = U : π.`]})}},
7:{t:'Das weite Seil',r:11,f(){const r=pick([20,25,30,40]),h=pick([2,3,4,5,6,8,10]);return mk({mode:'pi',story:`Ein Seil liegt eng um ein Fass mit Radius ${r} cm. Nun soll es rundherum überall ${h} cm Abstand zum Fass haben. Wie viel Seil muss man dazukaufen?`,q:'Zusatz = ? (in cm)',target:2*h,ans:`${pS(2*h)} cm`,traps:[[h,'Der Umfang wächst um 2·π·h, nicht um π·h.','dr'],[2*(r+h),'Das wäre der ganze neue Umfang. Gefragt ist nur der Zusatz: U(neu) − U(alt).','form']],hints:[`Der neue Radius ist ${r}+${h}. Berechne U(neu) − U(alt).`,`2π·${r+h} − 2π·${r} = 2π·${h} = ${pS(2*h)}. Der alte Radius spielt keine Rolle.`]})}},
8:{t:'Vorder- und Hinterrad',r:9,f(){const d1=pick([50,60,70,80]),d2=pick([100,120,140]),n=R(40,120);return mk({dp:1,story:`Das Vorderrad eines Wagens (Durchmesser ${d1} cm) macht auf einer Strecke ${n} Umdrehungen. Das Hinterrad hat ${d2} cm Durchmesser. Wie viele Umdrehungen macht es auf derselben Strecke?`,q:'Umdrehungen = ?',target:n*d1/d2,ans:`${f(n*d1/d2,1)} Umdrehungen`,traps:[[n*d2/d1,'Verkehrt herum: Das grössere Rad dreht sich seltener, nicht öfter.','form'],[n*d1*d1/(d2*d2),'Die Umfänge verhalten sich wie die Durchmesser, nicht wie ihre Quadrate (das wären Flächen).','form']],hints:['Die Strecke ist für beide Räder gleich: n·π·d(vorne) = n(hinten)·π·d(hinten).',`${n}·${d1} : ${d2} ≈ ${f(n*d1/d2,1)}. Das π kürzt sich weg.`]})}},
9:{t:'Draht zum Reif',r:10,f(){const L=R(60,200),a=pick([2,3,4,5]);return mk({dp:1,story:`Von einem ${L} cm langen Draht werden ${a} cm zum Verdrillen abgezwickt. Der Rest wird zu einem runden Reif gebogen. Welchen Radius hat der Reif?`,q:'r = ? (in cm)',target:(L-a)/(2*PI),ans:`${f((L-a)/(2*PI),1)} cm`,traps:[[L/(2*PI),`Die ${a} cm zum Verdrillen gehören nicht zum Kreis und müssen zuerst abgezogen werden.`,'rech'],[(L-a)/PI,'Das ist der Durchmesser. Der Radius ist halb so gross.','dr']],hints:[`Der Umfang ist nur ${L} − ${a} = ${L-a} cm lang.`,`r = ${L-a} : (2·π) ≈ ${f((L-a)/(2*PI),1)} cm.`]})}},
11:{t:'Tresorring',r:9,f(){const D=pick([20,24,30,36,40,50]),t=pick([2,3,4,5,6]),d=D-2*t;return mk({dp:1,story:`Ein kreisringförmiger Tresorring hat aussen einen Durchmesser von ${D} cm und innen einen Durchmesser von ${d} cm. Wie dick ist der Ring?`,q:'Dicke = ? (in cm)',target:t,ans:`${t} cm`,traps:[[D-d,'Das ist der Unterschied der Durchmesser. Die Dicke entsteht auf beiden Seiten, also nur die Hälfte davon.','ring'],[(D+d)/2,'Das ist der mittlere Durchmesser. Gesucht ist die Dicke: (aussen − innen) : 2.','ring']],hints:['Dicke = Aussenradius − Innenradius.',`(${D} − ${d}) : 2 = ${t} cm.`]})}},
12:{t:'Weidering',r:10,f(){let ri,dd;do{ri=R(3,12);dd=R(2,8)}while(dd==2*ri);const ra=ri+dd;return mk({mode:'pi',story:`Eine ringförmige Weide liegt zwischen zwei kreisrunden Zäunen: Der innere hat einen Radius von ${ri} m, der äussere von ${ra} m. Wie lang sind beide Zäune zusammen?`,q:'Zaunlänge = ? (in m)',target:2*(ri+ra),ans:`${pS(2*(ri+ra))} m`,traps:[[2*ra,'Das ist nur der äussere Zaun. Der innere Rand gehört auch dazu.','ring'],[2*(ra-ri),'Du hast die Ränder subtrahiert. Gefragt ist die Summe beider Ränder.','ring'],[ri+ra,'Der Faktor 2 fehlt: U = 2·π·r bei jedem Rand.','dr']],hints:['Innenrand + Aussenrand = 2·π·r(innen) + 2·π·r(aussen).',`2π·${ri} + 2π·${ra} = 2π·${ri+ra} = ${pS(2*(ri+ra))} m.`]})}},
13:{t:'Eisenband',r:9,f(){const ri=R(5,20),dd=R(2,6);return mk({mode:'pi',story:`Ein Eisenband hat die Form eines Kreisrings. Der Innenradius beträgt ${ri} cm, das Band ist ${dd} cm dick. Wie lang ist der Aussenrand?`,q:'Aussenrand = ? (in cm)',target:2*(ri+dd),ans:`${pS(2*(ri+dd))} cm`,traps:[[2*ri,'Das ist der Innenrand. Gefragt ist der Aussenrand.','ring'],[2*ri+dd,'Die Dicke gehört zum Radius: r(aussen) = r(innen) + Dicke. Erst dann mal 2π.','ring'],[ri+dd,'Der Faktor 2 fehlt: U = 2·π·r.','dr']],hints:['Aussenradius = Innenradius + Dicke.',`r(aussen) = ${ri+dd} cm, also U = 2π·${ri+dd} = ${pS(2*(ri+dd))} cm.`]})}},
14:{t:'Ringförmiger Claim',r:11,f(){const ri=R(8,30),dd=R(2,6),Ui=Math.round(2*PI*ri),Ua=Math.round(2*PI*(ri+dd)),t=(Ua-Ui)/(2*PI);return mk({dp:1,story:`Ein ringförmiger Claim hat einen Innenrand von ${Ui} m und einen Aussenrand von ${Ua} m. Wie breit ist der Ring?`,q:'Breite = ? (in m)',target:t,ans:`${f(t,1)} m`,traps:[[(Ua-Ui)/PI,'Das ist der Unterschied der Durchmesser. Die Breite ist die Differenz der Radien.','dr'],[Ua/(2*PI),'Das ist nur der Aussenradius. Die Breite ist r(aussen) − r(innen).','ring'],[Ua-Ui,'Der Unterschied der Ränder ist 2π·Breite. Teile noch durch 2π.','form']],hints:['Rechne beide Ränder in Radien um: r = U : (2π).',`(${Ua} − ${Ui}) : (2π) ≈ ${f(t,1)} m.`]})}},
15:{t:'Neue Grenzlinie',r:12,f(){const A=R(30,60),d=R(2,6);return mk({mode:'pi',story:`Der Aussenrand eines Rings ist ${A}π cm lang. Der Ring ist ${d} cm dick. Wie lang ist sein Innenrand?`,q:'Innenrand = ? (in cm)',target:A-2*d,ans:`${pS(A-2*d)} cm`,traps:[[A-d,'Die Dicke wirkt auf den Radius. Der Rand ändert sich um 2π·Dicke, nicht um die Dicke selbst.','ring'],[A+2*d,'Der Innenrand ist kürzer als der Aussenrand. Du musst abziehen.','ring'],[A-4*d,'Der Radius ändert sich um die Dicke, also der Rand um 2π·Dicke. Du hast doppelt zu viel abgezogen.','dr']],hints:['Aussenradius ist A : 2, innen ist er um die Dicke kleiner.',`${A}π : (2π) = ${A/2}. Innenradius ${A/2-d}, also U = 2π·${A/2-d} = ${pS(A-2*d)} cm.`]})}},
16:{t:'Schürfplatz abstecken',r:11,f(){const ri=R(6,25),dd=R(2,7),Ui=Math.round(2*PI*ri),a=Ui/(2*PI);return mk({kind:'blank',dp:1,bt:'ring',story:`Ein ringförmiger Schürfplatz hat einen Innenrand von ${Ui} m und ist ${dd} m breit. Bestimme beide Radien.`,q:'Innen- und Aussenradius',labels:['Innenradius (m)','Aussenradius (m)'],blanks:[a,a+dd],ans:`Innenradius ${f(a,1)} m, Aussenradius ${f(a+dd,1)} m`,hints:['Innenradius: r = U : (2π).',`${Ui} : (2π) ≈ ${f(a,1)} m. Aussenradius = Innenradius + ${dd} m.`]})}},
17:{t:'Grosser Claim',r:14,f(){const ri=R(5,15),dd=R(2,6),U=Math.round(2*PI*(2*ri+dd)),s=U/(2*PI),t=(s-dd)/2;return mk({dp:1,story:`Bei einem ringförmigen Claim sind Innen- und Aussenrand zusammen ${U} m lang. Der Ring ist ${dd} m breit. Wie gross ist der Innenradius?`,q:'r(innen) = ? (in m)',target:t,ans:`${f(t,1)} m`,traps:[[s-dd,'Das ist r(innen) + r(aussen) − Breite, also 2·r(innen). Noch halbieren.','ring'],[(s+dd)/2,'Das ist der Aussenradius. Der Innenradius ist kleiner: Breite abziehen, nicht addieren.','ring'],[s/2,'Die Breite fehlt in deiner Rechnung: r(aussen) = r(innen) + Breite.','ring'],[(U/PI-dd)/2,'Du hast U : π statt U : (2π) gerechnet.','dr']],hints:['Beide Ränder: 2π·r(innen) + 2π·(r(innen) + Breite) = U. Teile zuerst durch 2π.',`U : (2π) ≈ ${f(s,2)} = 2·r(innen) + ${dd}. Löse nach r(innen) auf.`]})}},
18:{t:'Ring im Verhältnis',r:12,f(){const k=pick([1.5,2.5,3,4,1.25]),d=pick([3,4,5,6,8,10,12]),t=d/(k-1);return mk({dp:1,story:`Der Aussenrand eines Rings ist ${f(k)}-mal so lang wie sein Innenrand. Der Ring ist ${d} cm dick. Wie gross ist der Innenradius?`,q:'r(innen) = ? (in cm)',target:t,ans:`${f(t,1)} cm`,traps:[[d/k,'Der Aussenradius ist k-mal der Innenradius, die Dicke ist die Differenz (k−1)·r(innen).','ring'],[d*(k-1),'Du hast multipliziert. Aus (k−1)·r = Dicke folgt r = Dicke : (k−1).','rech'],[d*k/(k-1),'Das ist der Aussenradius. Gesucht ist der Innenradius.','ring']],hints:[`Aussenrand ist ${f(k)}-mal so lang, also auch r(aussen) = ${f(k)}·r(innen).`,`Dicke = ${f(k)}·r − r = ${f(k-1)}·r = ${d}. Also r = ${d} : ${f(k-1)}.`]})}},
19:{t:'Randlängen des Rings',r:12,f(){const ra=R(10,30),dd=R(2,6),i=2*PI*(ra-dd),a=2*PI*ra;return mk({kind:'blank',dp:1,bt:'ring',story:`Ein Kreisring hat einen Aussenradius von ${ra} cm und ist ${dd} cm dick. Wie lang sind sein Innenrand und sein Aussenrand?`,q:'Innen- und Aussenrand',labels:['Innenrand (cm)','Aussenrand (cm)'],blanks:[i,a],ans:`Innenrand ${f(i,1)} cm, Aussenrand ${f(a,1)} cm`,hints:[`Der Innenradius ist ${ra} − ${dd} = ${ra-dd} cm.`,`Innen: 2π·${ra-dd} ≈ ${f(i,1)} cm. Aussen: 2π·${ra} ≈ ${f(a,1)} cm.`]})}},
21:{t:'Bogenlänge',r:3,f(){const g=(a,b)=>b?g(b,a%b):a,al=pick([30,45,60,90,120,150,180,270]),m=180/g(al,180),r=m*pick([2,3,4,5]),c=r*al/180;return mk({mode:'pi',story:`Ein fächerförmiges Beet (Kreissektor) hat einen Radius von ${r} m und einen Öffnungswinkel von ${al}°. Wie lang ist der Bogen am äusseren Rand?`,q:'Bogen b = ? (in m)',target:c,ans:`${pS(c)} m`,traps:[[2*r,'Das ist der ganze Kreisumfang. Nimm nur den Anteil α/360°.','sek'],[r*al/360,'Der Anteil stimmt, aber der Kreisumfang ist 2·π·r, nicht π·r.','dr'],[r*r*al/360,'Das ist die Sektorfläche, nicht die Bogenlänge.','form']],hints:['Bogen = α/360° · 2·π·r.',`${al}/360 · 2π · ${r} = ${pS(c)} m.`]})}},
22:{t:'Sektorumfang',r:3,f(){const r=R(5,20),al=pick([40,60,72,90,100,120,150,200]),b=PI*r*al/180,t=b+2*r;return mk({dp:1,story:`Ein fächerförmiges Beet hat einen Radius von ${r} m und einen Öffnungswinkel von ${al}°. Es wird rundherum eingezäunt (Bogen und die zwei geraden Seiten). Wie lang ist der Zaun?`,q:'U = ? (in m)',target:t,ans:`${f(t,1)} m`,traps:[[b,'Das ist nur der Bogen. Beim Sektor kommen noch die zwei Radien dazu.','sek'],[b+r,'Es sind zwei gerade Seiten, jede so lang wie der Radius.','sek'],[2*PI*r+2*r,'Der Bogen ist nur der Anteil α/360° vom Kreisumfang.','sek']],hints:['Sektorumfang = Bogen + 2·r.',`Bogen = ${al}/360 · 2π · ${r} ≈ ${f(b,1)} m, dazu ${2*r} m.`]})}},
23:{t:'Bogen und Radius',r:3,f(){const al=pick([30,40,60,75,90,120,150]),r0=R(6,30),b=Math.round(PI*r0*al/180*10)/10,t=180*b/(PI*al);return mk({dp:1,story:`Der Bogen eines Sektors misst ${f(b,1)} cm, sein Öffnungswinkel beträgt ${al}°. Wie gross ist der Radius?`,q:'r = ? (in cm)',target:t,ans:`${f(t,1)} cm`,traps:[[b/(2*PI),'Du hast den Winkelanteil vergessen. Der Bogen ist nur α/360° vom ganzen Umfang.','sek'],[2*t,'Das ist der Durchmesser. Der Radius ist halb so gross.','dr'],[180*b/al,'Das π fehlt: r = (b · 180°) : (π · α).','form']],hints:['Stelle b = α/360° · 2·π·r nach r um.',`r = ${f(b,1)} · 180 : (π · ${al}) ≈ ${f(t,1)} cm.`]})}},
24:{t:'Bogen und Winkel',r:3,f(){const al=pick([40,50,60,75,90,120,150,210]),r=R(6,30),b=Math.round(PI*r*al/180*10)/10,t=180*b/(PI*r);return mk({dp:1,story:`Ein Sektor mit Radius ${r} cm hat einen Bogen von ${f(b,1)} cm Länge. Wie gross ist der Öffnungswinkel?`,q:'α = ? (in °)',target:t,ans:`${f(t,1)}°`,traps:[[b/(2*PI*r),'Das ist der Anteil am Kreis (als Bruch). Mal 360° ergibt den Winkel.','sek'],[2*t,'Du hast r wie einen Durchmesser behandelt. Der Umfang ist 2·π·r.','dr']],hints:['Der Anteil am Kreis ist b : (2·π·r). Mal 360° ergibt den Winkel.',`${f(b,1)} : (2π · ${r}) · 360° ≈ ${f(t,1)}°.`]})}},
25:{t:'Halbkreis-Beet',r:3,f(){const d=pick([10,12,16,20,24,30,40]),t=PI*d/2+d;return mk({dp:1,story:`Ein halbkreisförmiges Beet hat einen Durchmesser von ${d} m. Es wird rundherum eingezäunt (Bogen und gerade Kante). Wie lang ist der Zaun?`,q:'U = ? (in m)',target:t,ans:`${f(t,1)} m`,traps:[[PI*d,'Das ist der Umfang des ganzen Kreises. Der Bogen ist nur die Hälfte.','sek'],[PI*d/2,'Das ist nur der Bogen. Die gerade Kante fehlt.','sek'],[PI*d/2+d/2,'Die gerade Kante ist der ganze Durchmesser, nicht nur der Radius.','dr']],hints:['Halbkreis: Bogen = π·d : 2, dazu kommt der Durchmesser.',`π·${d} : 2 ≈ ${f(PI*d/2,1)} m, plus ${d} m.`]})}},
26:{t:'Ungleiche Fächer',r:3,f(){const a1=pick([40,60,75,80]),a2=pick([100,120,150,200]),b1=R(8,30),t=b1*a2/a1;return mk({dp:1,story:`Zwei fächerförmige Beete haben denselben Radius. Das erste hat einen Öffnungswinkel von ${a1}° und einen Bogen von ${b1} m. Das zweite hat einen Winkel von ${a2}°. Wie lang ist sein Bogen?`,q:'Bogen 2 = ? (in m)',target:t,ans:`${f(t,1)} m`,traps:[[b1*a1/a2,'Verkehrt herum: Ein grösserer Winkel gibt einen längeren Bogen.','sek'],[b1+a2-a1,'Bogenlänge und Winkel sind proportional, nicht additiv.','sek']],hints:['Bei gleichem Radius ist die Bogenlänge proportional zum Winkel.',`${b1} · ${a2} : ${a1} ≈ ${f(t,1)} m.`]})}},
27:{t:'Umfang rückwärts',r:3,f(){const r=R(5,20),al=pick([60,90,120,150,200,240]),k=2+PI*al/180,U=Math.round(r*k),t=U/k;return mk({dp:1,story:`Ein Sektor mit einem Öffnungswinkel von ${al}° hat einen Umfang von ${U} m (Bogen und beide Radien). Wie gross ist der Radius?`,q:'r = ? (in m)',target:t,ans:`${f(t,1)} m`,traps:[[U/(PI*al/180),'Die zwei Radien gehören zum Umfang. U = Bogen + 2·r.','sek'],[U/(1+PI*al/180),'Es sind zwei Radien am Rand, nicht nur einer.','sek'],[U/(2+2*PI),'Der Bogen ist nur α/360° vom Kreisumfang.','sek']],hints:[`U = 2·r + ${al}/360 · 2π·r. Klammere r aus.`,`r = ${U} : (2 + π·${al}/180) ≈ ${f(t,1)} m.`]})}},
28:{t:'Zwei Unbekannte',r:3,f(){const r=R(5,20),al=pick([50,60,72,90,100,120,150]),b=Math.round(PI*r*al/180*10)/10,U=b+2*r,rr=(U-b)/2,a2=180*b/(PI*rr);return mk({kind:'blank',dp:1,bt:'sek',story:`Ein Sektor hat einen Umfang von ${f(U,1)} cm. Sein Bogen allein ist ${f(b,1)} cm lang. Bestimme Radius und Öffnungswinkel.`,q:'Radius und Winkel',labels:['Radius (cm)','Winkel (°)'],blanks:[rr,a2],ans:`Radius ${f(rr,1)} cm, Winkel ${f(a2,1)}°`,hints:['Umfang minus Bogen sind die zwei Radien.',`r = (${f(U,1)} − ${f(b,1)}) : 2 = ${f(rr,1)} cm. Dann α = b : (2πr) · 360°.`]})}},
29:{t:'Gleicher Rand',r:3,f(){const r=pick([10,12,15,20]),al=pick([60,90,120,150,200,240]),p=Math.round((2*r+PI*r*al/180)/(2*PI)*10)/10,t=(2*PI*p-2*r)*180/(PI*r);return mk({dp:1,story:`Ein Sektor hat einen Radius von ${r} cm. Sein Umfang (Bogen und beide Radien) ist genauso lang wie der Umfang eines Kreises mit Radius ${f(p,1)} cm. Wie gross ist sein Öffnungswinkel?`,q:'α = ? (in °)',target:t,ans:`${f(t,1)}°`,traps:[[360*p/r,'Beim Sektor gehören die zwei Radien zum Umfang. Ziehe sie zuerst ab.','sek'],[(2*PI*p-r)*180/(PI*r),'Es sind zwei Radien, die abgezogen werden müssen.','sek'],[(2*PI*p-2*r)/(2*PI*r),'Das ist der Anteil am Kreis. Mal 360° ergibt den Winkel.','sek']],hints:['Kreisumfang = Bogen + 2·r. Berechne daraus den Bogen.',`Bogen = 2π·${f(p,1)} − ${2*r} ≈ ${f(2*PI*p-2*r,1)} cm. Dann α = Bogen : (2π·${r}) · 360°.`]})}}
};
const JOBS1=[1,2,1,3,9,3,4,7,4,5,6,8],JOBS2=[14,15,16,11,13,11,12,18,12,17,19,17];
const ITEMS=[ // a = ab welchem Akt im Angebot
{id:'ticket',n:'Zugticket',p:40,e:'🎫',a:1,d:'Einfache Fahrt in die nächste grössere Stadt.'},
{id:'water',n:'Wasserflasche',p:6,e:'💧',a:1,d:'Gefüllt mit frischem Brunnenwasser.'},
{id:'food',n:'Proviant',p:10,e:'🥫',a:1,d:'Bohnen, Speck und Zwieback.'},
{id:'shovel',n:'Schaufel',p:18,e:'🪏',a:1,d:'Günstig und robust. Aber du schaufelst alles selbst.'},
{id:'pick',n:'Spitzhacke',p:34,e:'⛏️',a:1,d:'Teurer, bricht dafür auch hartes Gestein auf.'},
{id:'map',n:'Landkarte',p:12,e:'🗺️',a:1,d:'Zeigt Pfade und Wasserstellen im Gebirge.'},
{id:'lamp',n:'Laterne',p:9,e:'🏮',a:1,d:'Für dunkle Nächte und finstere Stollen.'},
{id:'scale',n:'Goldwaage',p:15,e:'⚖️',a:1,d:'Fein justiert, wiegt auf das Gramm genau.'}
,{id:'horse',n:'Pferd',p:70,e:'🐎',a:2,d:'Schnell und ausdauernd. Frisst aber auch gut.'},
{id:'mule',n:'Maultier',p:35,e:'🐴',a:2,d:'Trittsicher und günstig, aber gemächlich.'},
{id:'tent',n:'Zelt',p:16,e:'⛺',a:2,d:'Ein trockener Schlafplatz am See.'},

{id:'glass',n:'Fernglas',p:22,e:'🔭',a:2,d:'Zeigt dir weit entfernte Berge.'}
];

const DESC={shovel:'Günstig und robust: eine Schicht pro gelöster Aufgabe.',pick:'Teurer, bricht dafür zwei Schichten auf einmal auf.',horse:'Schnell: Auf dem Weg zum See passiert kaum etwas.',mule:'Günstig, aber langsam: Unterwegs passiert mehr. Die Packtaschen helfen etwas.',water:'Hilft, wenn der Weg heiss und trocken wird.',rope:'Hilft auf steilen, gefährlichen Pfaden.',tent:'Schutz bei Unwetter und ein trockener Schlafplatz.',map:'Hilft bei Nebel und schlechter Sicht im Gebirge.',food:'Gegen Müdigkeit bei harter Arbeit.',lamp:'Für dunkle Stollen und tiefe Gruben.',glass:'Wer weit sieht, findet das Silber früher.'};
ITEMS.forEach(i=>{if(DESC[i.id])i.d=DESC[i.id]});
/* ================= 3. SPIELZUSTAND, UI ================= */
const $=i=>document.getElementById(i),KEY='silbersee-kreis-v1';
let S=null,T=null,open=true,G={};
const newS=n=>({name:n,money:0,inv:[],act:1,solved:0,tips:0,err:{},pool:[...JOBS1],nf:0,oh:0,sh:0});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const has=i=>S.inv.includes(i);
const P=h=>{$('cd').innerHTML=h;$('pn').classList.add('on');open=true;$('pr').style.display='none'};
G.x=()=>{$('pn').classList.remove('on');open=false};
const hud=()=>{$('nm').textContent='🤠 '+S.name;$('mo').textContent='💰 $'+S.money;$('inv').innerHTML=S.inv.map(i=>{const t=ITEMS.find(x=>x.id==i);return`<span title="${t.n}">${t.e}</span>`}).join('')};
let tt;const toast=m=>{const e=$('ts');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2200)};
const disp=s=>s.replace(/\^2/g,'²').replace(/-/g,'−').replace(/\*/g,'·');

G.menu=()=>{const o=load();P(`<h2>Der Silbersee</h2><p>Dustville, 1881. Im Gebirge soll ein See liegen, an dessen Ufer Silber glänzt. Du hast nur eins: Mut zum Rechnen.</p><p><b>Wie heisst du, Fremder?</b></p><input class="t" id="nmi" maxlength="16" placeholder="Dein Name" onkeydown="if(event.key=='Enter')G.new()"><p><button class="b" onclick="G.new()">Abenteuer starten</button>${o&&o.name?`<button class="b g" onclick="G.cont()">Weiter als ${o.name.replace(/[<>&"]/g,'')} ($${o.money})</button>`:''}</p><small>Steuerung: WASD oder Pfeiltasten zum Laufen, E zum Reden und Handeln. Dein Fortschritt wird automatisch im Browser gespeichert.</small>`)};
G.new=()=>{const n=($('nmi').value||'Fremder').replace(/[<>&"]/g,'').trim()||'Fremder';S=newS(n);save();G.begin(true)};
G.cont=()=>{S=Object.assign(newS('?'),load());G.begin(false)};
G.begin=first=>{$('hud').hidden=false;hud();go(['town','city','lake'][S.act-1]);
 if(first)P(`<h2>Willkommen in Dustville, ${S.name}!</h2><p>Dein Beutel ist leer. Verdiene dir mit Rechenaufträgen rund um den Kreisumfang ein paar Dollar: bei der <b>Jobtafel</b>, im <b>Saloon</b>, in der <b>Schmiede</b> und im <b>Claim-Büro</b>. Der <b>Sheriff</b> und der <b>Alte am Brunnen</b> wissen mehr über den Weg ins Gebirge. Im <b>Store</b> gibt es Ausrüstung. Überlege gut, was du kaufst!</p><button class="b" onclick="G.x()">Los geht’s</button>`);else G.x()};
G.bag=()=>{if(!S)return;const e=Object.entries(S.err).map(([k,v])=>`<li>${ERRL[k]}: ${v}×</li>`).join('')||'<li>Noch keine Fehler. Stark!</li>';
 P(`<h2>🎒 Rucksack</h2><p><b>Dollar:</b> $${S.money}</p><p><b>Ausrüstung:</b> ${S.inv.length?S.inv.map(i=>{const t=ITEMS.find(x=>x.id==i);return t.e+' '+t.n}).join(', '):'noch nichts'}</p><p><b>Auswertung</b> (für die Lehrperson)<br>Gelöste Aufträge: ${S.solved}, gekaufte Tipps: ${S.tips}</p><ul>${e}</ul><button class="b" onclick="G.x()">Schliessen</button><button class="b g" onclick="if(confirm('Wirklich neu beginnen? Der Fortschritt geht verloren.')){G.menu()}">Neues Spiel</button>`)};

/* Jobtafel & Aufgaben */
G.board=()=>{const o=S.pool.slice(0,3);
 P(`<h2>📜 Jobtafel</h2>`+(o.length?'<p>Wähle einen Auftrag:</p>'+o.map((g,i)=>`<div class="it"><span class="em">📄</span><div><b>${GEN[g].t}</b><br><small>Lohn: $${GEN[g].r}</small></div><button class="b" onclick="G.job(${i})">Annehmen</button></div>`).join(''):'<p>Alle Aufträge sind erledigt. Vielleicht weiss der Sheriff noch Rat.</p>')+`<button class="b g" onclick="G.x()">Schliessen</button>`)};
G.job=i=>{const g=GEN[S.pool[i]];T=g.f();Object.assign(T,{i,r:g.r,n:0,h:0});G.task()};
G.task=()=>{const kp=['π',',','−',...'0123456789','⌫'].map(k=>`<button class="b g" onclick="G.ins('${k}')">${k}</button>`).join('');
 P(`<h2>${T.ttl||GEN[S.pool[T.i]].t}</h2><p>${T.story}</p><div class="q">${T.q}</div><p><small>${T.ins}</small></p>${T.kind=='blank'?BL():`<input class="t" id="in" inputmode="none" autocomplete="off" placeholder="Deine Antwort" onkeydown="if(event.key=='Enter')G.chk()"><div class="kp">${kp}</div>`}<div id="fb"></div><div id="hn"></div><button class="b" onclick="G.chk()">Prüfen</button><button class="b g" id="hb" onclick="G.hint()">Tipp kaufen ($2)</button><button class="b g" onclick="G.x()">Abbrechen</button><span id="sl"></span>`);($('in')||$('b0')).focus()};
G.ins=t=>{const i=$('in'),s=i.selectionStart,e=i.selectionEnd;if(t=='⌫'){const a=s==e?Math.max(0,s-1):s;i.value=i.value.slice(0,a)+i.value.slice(e);i.setSelectionRange(a,a)}else{i.value=i.value.slice(0,s)+t+i.value.slice(e);i.setSelectionRange(s+t.length,s+t.length)}i.focus()};
G.chk=()=>{const r=T.kind=='blank'?chkB():check(T,$('in').value);snd(r.ok?'ok':'bad');
 if(r.ok){if(T.dig)return T.ev?G.evd():G.dug();S.money+=T.r;S.solved++;if(T.i>=0)S.pool.splice(T.i,1);if(T.gj)S.gj=(S.gj||0)+1;save();hud();
  P(`<h2>✔ Richtig!</h2><p class="good">Das macht $${T.r}. Sauber gerechnet, ${S.name}!</p><p>Lösung: <b>${disp(T.ans)}</b></p><button class="b" onclick="G.x()">Weiter</button><button class="b g" onclick="${T.gj?'G.sher()':'G.board()'}">${T.gj?'Zum Sheriff':'Nächster Auftrag'}</button>`);return}
 if(r.t){S.err[r.t]=(S.err[r.t]||0)+1;if(r.t!='unf')T.n++}else T.n++;save();
 $('fb').innerHTML=`<span class="bad">✘ ${r.m}</span>`+G.pen();
 if(T.n>=3)$('sl').innerHTML='<button class="b g" onclick="G.sol()">Lösungsweg zeigen (ohne Lohn)</button>'};
G.hint=()=>{if(T.h>=2){toast('Mehr Tipps gibt es nicht.');return}if(S.money<2){toast('Du hast zu wenig Geld für einen Tipp.');return}
 S.money-=2;S.tips++;save();hud();$('hn').innerHTML+=`<p>💡 ${T.hints[T.h++]}</p>`;if(T.h>=2)$('hb').disabled=true};
G.sol=()=>P(`<h2>Lösungsweg</h2><p>${T.story}</p><div class="q">${T.q}</div><p>Lösung: <b>${disp(T.ans)}</b></p><p>${T.hints[1]}</p><p><small>${T.dig?'Dafür gräbst du keine Schicht tiefer. Du bekommst eine neue Aufgabe.':T.gj?'Dafür gibt es keinen Lohn. Du bekommst eine neue Aufgabe.':'Dafür gibt es keinen Lohn. Der Auftrag hängt aber noch an der Tafel, mit neuen Zahlen.'}</small></p><button class="b" onclick="${T.dig?(T.ev?'G.evt(...EVP)':'G.dig()'):T.gj?'G.gjob()':'G.board()'}">${T.dig?'Weitergraben':T.gj?'Neue Aufgabe':'Zur Jobtafel'}</button>`);

/* Store, Sheriff, Alter, Bahnhof */
G.shop=()=>P(`<h2>🏪 Gemischtwaren Miller</h2><p>„Willkommen, Fremder! Schau dich in Ruhe um. Aber überleg dir gut, was in deinen Beutel kommt.“</p><p><b>Dein Geld: $${S.money}</b></p>`+ITEMS.filter(i=>i.a<=S.act&&(i.id!='ticket'||S.act==1)).map(i=>`<div class="it"><span class="em">${i.e}</span><div><b>${i.n}</b>, $${i.p}<br><small>${i.d}</small></div>${has(i.id)?`<button class="b g" onclick="G.ret('${i.id}')">Zurückgeben (+$${i.p>>1})</button>`:`<button class="b" onclick="G.buy('${i.id}')">Kaufen</button>`}</div>`).join('')+`<button class="b" onclick="G.x()">Schliessen</button>`);
