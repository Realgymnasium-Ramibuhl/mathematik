<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funktionsgraphen</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#343a40}.container{max-width:1400px;margin:auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px #0005;overflow:hidden}header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:28px;text-align:center}h1{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:8px}.subtitle{opacity:.9}.modebar{display:flex;justify-content:center;gap:10px;padding:16px;background:#eef0ff;border-bottom:1px solid #dde1ff}.mode-btn,.function-btn,.quiz-type-btn,.answer-btn,.restart-btn{border:2px solid #e2e5ea;border-radius:10px;background:#fff;color:#495057;font-weight:700;cursor:pointer;transition:.2s}.mode-btn{padding:11px 20px}.mode-btn.active,.quiz-type-btn.active{background:#667eea;color:#fff;border-color:#667eea}.controls{display:flex;flex-wrap:wrap;gap:10px;padding:20px;background:#f8f9fa}.function-btn{padding:12px 18px;font-size:13px}.function-btn:hover,.answer-btn:hover{transform:translateY(-2px);box-shadow:0 5px 12px #0002}.function-btn.active{background:#28a745;color:#fff;border-color:#28a745}.function-btn.active:before{content:'✓ '}.main-content{display:flex;padding:30px;gap:30px}.canvas-container{flex:1;display:flex;justify-content:center;align-items:center}canvas{max-width:100%;height:auto;border:2px solid #e9ecef;border-radius:10px;box-shadow:0 4px 12px #0001}.sidebar{width:300px;display:flex;flex-direction:column;gap:20px}.panel{background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 12px #0001;border:2px solid #e9ecef}.panel h3{color:#667eea;margin-bottom:16px}.slider-container{display:none}.slider-container.active{display:block}.slider-wrapper input{width:100%}.slider-value{text-align:center;font-size:2em;color:#764ba2;font-weight:700;margin-top:15px}.legend-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}.legend-color{width:30px;height:4px;border-radius:2px}
#quizView{display:none;padding:24px 30px 36px}.quiz-top{position:sticky;top:0;background:#fff;z-index:3;padding:4px 0 18px}.score-row{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:8px;font-weight:700}.progress-track{height:18px;background:#e9ecef;border-radius:999px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#28a745,#6fda83);transition:width .35s}.quiz-types{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.quiz-type-btn{padding:12px 18px}.question-card{background:#f8f9fa;border:2px solid #e9ecef;border-radius:16px;padding:22px;max-width:1050px;margin:auto;text-align:center}.question-label{font-size:.95rem;color:#6c757d;font-weight:700;margin-bottom:12px}.equation-prompt{font-size:1.65rem;min-height:65px;display:flex;align-items:center;justify-content:center}.question-canvas{width:min(520px,100%);margin:auto}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}.answer-btn{padding:14px;min-height:66px}.answer-btn.graph-choice{padding:8px}.answer-btn canvas{width:100%;box-shadow:none;border:1px solid #dee2e6}.answer-btn.correct{border-color:#28a745;background:#eaf8ed}.answer-btn.wrong{border-color:#dc3545;background:#fdebed}.feedback{min-height:32px;margin:16px 0 2px;font-size:1.05rem;font-weight:700}.feedback.good{color:#218838}.feedback.bad{color:#c82333}.finish{display:none;position:relative;overflow:hidden;text-align:center;padding:36px 20px;background:linear-gradient(135deg,#fff8d8,#fff);border:3px solid #f4c542;border-radius:18px;max-width:720px;margin:20px auto}.finish.show{display:block}.medal{font-size:6rem;animation:pop .7s ease}.finish h2{font-size:2rem;color:#765500;margin:8px}.restart-btn{padding:12px 20px;background:#667eea;color:#fff;border-color:#667eea;margin-top:16px}.sparkle{position:absolute;top:-20px;font-size:22px;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(430px) rotate(540deg);opacity:0}}@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media(max-width:850px){.main-content{flex-direction:column;padding:18px}.sidebar{width:100%}.answers{grid-template-columns:repeat(2,minmax(0,1fr))}#quizView{padding:18px}}@media(max-width:520px){body{padding:8px}.answers{grid-template-columns:1fr}.score-row{font-size:.88rem}.question-card{padding:14px}}
</style>
</head>
<body><div class="container">
<header><h1>📊 Funktionsgraphen, die du kennen musst!</h1><p class="subtitle">Interaktive Visualisierung und Quiz zu wichtigen Grundfunktionen</p></header>
<div class="modebar"><button class="mode-btn active" data-view="learn">Visualisieren</button><button class="mode-btn" data-view="quiz">Quiz-Modus</button></div>
<section id="learnView">
<div class="controls" id="functionControls"></div>
<div class="main-content"><div class="canvas-container"><canvas id="graphCanvas" width="700" height="700"></canvas></div><div class="sidebar">
<div class="panel slider-container" id="sliderContainer"><h3>Exponent anpassen</h3><div class="slider-wrapper"><input type="range" id="powerSlider" min="-10" max="10" step="1" value="2"><div class="slider-value">n = <span id="powerValue">2</span></div></div></div>
<div class="panel"><h3>Aktive Funktionen</h3><div id="legendContent"></div></div></div></div></section>
<section id="quizView">
<div class="quiz-top"><div class="score-row"><span id="scoreText">0 von 50 Punkten</span><span id="streakText">Serie: 0 · nächste richtige Antwort: +1</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
<div class="quiz-types"><button class="quiz-type-btn active" data-type="graphToEquation">Graph → Gleichung</button><button class="quiz-type-btn" data-type="equationToGraph">Gleichung → Graph</button></div>
<div class="question-card" id="questionCard"><div class="question-label" id="questionLabel"></div><div id="prompt"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div></div>
<div class="finish" id="finish"><div class="medal">🏅</div><h2>50 Punkte geschafft!</h2><p>Du hast die Grundfunktionen sicher erkannt.</p><button class="restart-btn" id="restartBtn">Neues Quiz starten</button></div>
</section></div>
<script>
const F={
 linear:{tex:'f(x) = x',fn:x=>x,color:'#667eea'},quadratic:{tex:'f(x) = x^2',fn:x=>x*x,color:'#e74c3c'},cubic:{tex:'f(x) = x^3',fn:x=>x*x*x,color:'#3498db'},sqrt:{tex:'f(x) = \\sqrt{x} = x^{\\frac{1}{2}}',fn:x=>x>=0?Math.sqrt(x):null,color:'#9b59b6'},exponential:{tex:'f(x) = e^x',fn:x=>Math.exp(x),color:'#e67e22'},exp_neg:{tex:'f(x) = e^{-x} = \\left(\\frac1e\\right)^x',fn:x=>Math.exp(-x),color:'#d35400'},two_exp:{tex:'f(x) = 2^x',fn:x=>2**x,color:'#e84393'},two_exp_neg:{tex:'f(x) = 2^{-x} = \\left(\\frac12\\right)^x',fn:x=>2**(-x),color:'#fd79a8'},logarithm:{tex:'f(x) = \\ln(x)',fn:x=>x>0?Math.log(x):null,color:'#16a085'},sin:{tex:'f(x) = \\sin(x)',fn:x=>Math.sin(x),color:'#c0392b'},cos:{tex:'f(x) = \\cos(x)',fn:x=>Math.cos(x),color:'#2980b9'},tan:{tex:'f(x) = \\tan(x)',fn:x=>Math.tan(x),color:'#8e44ad'},reciprocal:{tex:'f(x) = x^{-1} = \\frac1x',fn:x=>x!==0?1/x:null,color:'#27ae60'},reciprocal_squared:{tex:'f(x) = x^{-2} = \\frac1{x^2}',fn:x=>x!==0?1/(x*x):null,color:'#f39c12'}};
const keys=Object.keys(F), controls=document.getElementById('functionControls');
keys.forEach((k,i)=>{const b=document.createElement('button');b.className='function-btn'+(i===0?' active':'');b.dataset.function=k;b.innerHTML='$'+F[k].tex+'$';controls.appendChild(b)});const pb=document.createElement('button');pb.className='function-btn';pb.dataset.function='power';pb.innerHTML='$f(x)=x^n$';controls.appendChild(pb);
let powerExponent=2, active=new Set(['linear']);const powerFunc={get tex(){return `f(x)=x^{${powerExponent}}`},fn:x=>{if(powerExponent===0)return 1;if(powerExponent<0&&x===0)return null;return Math.pow(x,powerExponent)},color:'#9b59b6'};
function renderMath(el=document.body){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})}
function paint(canvas,func,color='#667eea',large=false){const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height,s=Math.min(w,h)/(large?12:10),cx=w/2,cy=h/2;c.clearRect(0,0,w,h);c.strokeStyle='#eceff2';c.lineWidth=1;for(let i=-6;i<=6;i++){c.beginPath();c.moveTo(cx+i*s,0);c.lineTo(cx+i*s,h);c.stroke();c.beginPath();c.moveTo(0,cy+i*s);c.lineTo(w,cy+i*s);c.stroke()}c.strokeStyle='#444';c.lineWidth=1.5;c.beginPath();c.moveTo(0,cy);c.lineTo(w,cy);c.moveTo(cx,0);c.lineTo(cx,h);c.stroke();c.strokeStyle=color;c.lineWidth=large?3:2.4;c.beginPath();let started=false,prevY=null;for(let px=0;px<w;px++){const x=(px-cx)/s,y=func(x),py=cy-y*s;const valid=y!==null&&Number.isFinite(y)&&py>-120&&py<h+120&&!((prevY!==null)&&Math.abs(py-prevY)>h*.55);if(valid){if(!started)c.moveTo(px,py);else c.lineTo(px,py);started=true}else started=false;prevY=valid?py:null}c.stroke()}
const mainCanvas=document.getElementById('graphCanvas');function drawLearn(){paint(mainCanvas,x=>NaN);const c=mainCanvas.getContext('2d');active.forEach(k=>{const f=k==='power'?powerFunc:F[k];paintOverlay(c,mainCanvas,f.fn,f.color)})}function paintOverlay(c,canvas,func,color){const w=canvas.width,h=canvas.height,s=Math.min(w,h)/12,cx=w/2,cy=h/2;c.strokeStyle=color;c.lineWidth=3;c.beginPath();let st=false,prev=null;for(let px=0;px<w;px++){const x=(px-cx)/s,y=func(x),py=cy-y*s,v=y!==null&&Number.isFinite(y)&&py>-100&&py<h+100&&!(prev!==null&&Math.abs(py-prev)>h*.55);if(v){st?c.lineTo(px,py):c.moveTo(px,py);st=true}else st=false;prev=v?py:null}c.stroke()}
function legend(){const el=document.getElementById('legendContent');if(!active.size){el.innerHTML='<p style="color:#999">Wähle Funktionen aus.</p>';return}el.innerHTML=[...active].map(k=>{const f=k==='power'?powerFunc:F[k];return `<div class="legend-item"><span class="legend-color" style="background:${f.color}"></span><span>$${f.tex}$</span></div>`}).join('');renderMath(el)}
controls.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.function;active.has(k)?active.delete(k):active.add(k);b.classList.toggle('active');document.getElementById('sliderContainer').classList.toggle('active',active.has('power'));legend();drawLearn()});document.getElementById('powerSlider').addEventListener('input',e=>{powerExponent=+e.target.value;document.getElementById('powerValue').textContent=powerExponent;legend();drawLearn()});
let score=0,streak=0,type='graphToEquation',correctKey='',locked=false;const shuffle=a=>[...a].sort(()=>Math.random()-.5);function sixWith(answer){return shuffle([answer,...shuffle(keys.filter(k=>k!==answer)).slice(0,5)])}function updateScore(){document.getElementById('scoreText').textContent=`${score} von 50 Punkten`;document.getElementById('streakText').textContent=`Serie: ${streak} · nächste richtige Antwort: +${streak+1}`;document.getElementById('progressFill').style.width=Math.min(100,score/50*100)+'%'}
function newQuestion(){if(score>=50)return finish();locked=false;correctKey=keys[Math.floor(Math.random()*keys.length)];const opts=sixWith(correctKey),prompt=document.getElementById('prompt'),ans=document.getElementById('answers'),label=document.getElementById('questionLabel');document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback';ans.innerHTML='';if(type==='graphToEquation'){label.textContent='Welche Funktionsgleichung gehört zu diesem Graphen?';prompt.innerHTML='<canvas class="question-canvas" id="questionCanvas" width="620" height="380"></canvas>';paint(document.getElementById('questionCanvas'),F[correctKey].fn,'#667eea');opts.forEach(k=>{const b=document.createElement('button');b.className='answer-btn';b.dataset.key=k;b.innerHTML='$'+F[k].tex+'$';ans.appendChild(b)});renderMath(ans)}else{label.textContent='Welcher Graph gehört zu dieser Funktionsgleichung?';prompt.innerHTML='<div class="equation-prompt">$'+F[correctKey].tex+'$</div>';opts.forEach(k=>{const b=document.createElement('button');b.className='answer-btn graph-choice';b.dataset.key=k;b.setAttribute('aria-label','Graph auswählen');b.innerHTML='<canvas width="260" height="180"></canvas>';ans.appendChild(b);paint(b.querySelector('canvas'),F[k].fn,'#667eea')});renderMath(prompt)}}
function motivation(s){if(s>=7)return 'Beeindruckend – '+s+' richtige Antworten in Folge!';if(s>=5)return 'Starke Serie. Die nächste richtige Antwort bringt '+(s+1)+' Punkte.';if(s>=3)return s+' in Folge. Du erkennst die Funktionen immer sicherer.';return ['Richtig. Die Serie läuft!','Genau erkannt!','Treffer. Weiter geht’s!'][Math.floor(Math.random()*3)]}
document.getElementById('answers').addEventListener('click',e=>{const b=e.target.closest('.answer-btn');if(!b||locked)return;locked=true;const ok=b.dataset.key===correctKey,fb=document.getElementById('feedback');if(ok){streak++;score+=streak;b.classList.add('correct');fb.textContent=`Richtig: +${streak} Punkt${streak===1?'':'e'}. ${motivation(streak)}`;fb.className='feedback good'}else{streak=0;b.classList.add('wrong');document.querySelector(`.answer-btn[data-key="${correctKey}"]`)?.classList.add('correct');fb.textContent='Noch nicht. Deine Gesamtpunkte bleiben, die Serie beginnt neu.';fb.className='feedback bad'}updateScore();setTimeout(()=>score>=50?finish():newQuestion(),1300)});
function finish(){document.getElementById('questionCard').style.display='none';const f=document.getElementById('finish');f.classList.add('show');for(let i=0;i<55;i++){const s=document.createElement('span');s.className='sparkle';s.textContent=['✨','◆','●','★'][i%4];s.style.left=Math.random()*100+'%';s.style.animationDuration=(1.8+Math.random()*2)+'s';s.style.animationDelay=Math.random()*.8+'s';s.style.color=['#f4c542','#667eea','#e84393','#28a745'][i%4];f.appendChild(s)}}
document.getElementById('restartBtn').addEventListener('click',()=>{score=0;streak=0;document.getElementById('finish').classList.remove('show');document.getElementById('finish').querySelectorAll('.sparkle').forEach(x=>x.remove());document.getElementById('questionCard').style.display='block';updateScore();newQuestion()});document.querySelectorAll('.quiz-type-btn').forEach(b=>b.addEventListener('click',()=>{type=b.dataset.type;document.querySelectorAll('.quiz-type-btn').forEach(x=>x.classList.toggle('active',x===b));newQuestion()}));document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x===b));const quiz=b.dataset.view==='quiz';document.getElementById('learnView').style.display=quiz?'none':'block';document.getElementById('quizView').style.display=quiz?'block':'none';if(quiz)newQuestion();else drawLearn()}));
window.addEventListener('load',()=>{renderMath();legend();drawLearn();updateScore()});
</script></body></html>
