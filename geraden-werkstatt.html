<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geradewerkstatt</title>
<style>
:root{--nav:#17324d;--blue:#256d9d;--aqua:#36a8a0;--sun:#efb94f;--coral:#e66b55;--ink:#183047;--muted:#687b8d;--line:#d8e3e9;--soft:#f2f7f8;--ok:#23805f;--bad:#b94f3c}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#edf3f5;overflow:hidden}button,input{font:inherit}button{cursor:pointer}
header{height:54px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 18px;gap:18px;box-shadow:0 2px 10px #10273a30}h1{font-size:1.05rem;margin:0;white-space:nowrap}.modes{display:flex;gap:4px;background:#ffffff18;padding:4px;border-radius:10px}.mode{border:0;background:transparent;color:#d6e4ed;padding:7px 12px;border-radius:7px;font-size:.82rem;font-weight:750}.mode.active{background:#fff;color:var(--nav)}.new{margin-left:auto;border:0;background:var(--coral);color:#fff;padding:8px 12px;border-radius:9px;font-weight:800;font-size:.82rem}.privacy{font-size:.72rem;color:#c8d9e3;white-space:nowrap}
.app{height:calc(100vh - 54px);padding:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(315px,390px);gap:12px;max-width:1500px;margin:auto}.panel{background:#fff;border:1px solid #fff;border-radius:16px;box-shadow:0 8px 24px #16354d12;min-height:0}.work{display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.taskbar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.taskbar strong{font-size:.9rem}.taskbar span{font-size:.82rem;color:var(--muted)}
.grapharea{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:10px 12px 6px}.canvaswrap{min-height:0;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fcfefe}.canvaswrap canvas{display:block;width:100%;height:100%;touch-action:none}.tip{position:absolute;top:8px;left:8px;background:#fffffff2;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:.7rem;color:var(--muted);pointer-events:none}.tools{display:flex;align-items:center;gap:7px;padding-top:7px;min-height:39px}.tool{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 9px;border-radius:8px;font-size:.76rem;font-weight:750}.tool.active{background:#e4f6f4;border-color:var(--aqua);color:#16635e}.drawhint{margin-left:auto;color:var(--muted);font-size:.72rem;text-align:right}
.answer{border-top:1px solid var(--line);background:#f7fafb;padding:9px 12px;display:grid;grid-template-columns:auto minmax(130px,1fr) auto minmax(130px,1fr) auto minmax(190px,1.4fr);gap:8px;align-items:center}.answer .label{font-family:Georgia,serif;font-weight:700}.answer input{min-width:0;width:100%;border:2px solid #d5e1e7;background:white;border-radius:9px;padding:8px 10px;outline:none}.answer input:focus{border-color:var(--aqua);box-shadow:0 0 0 3px #36a8a020}.answer input.good{border-color:var(--ok);background:#eff9f5}.answer input.bad{border-color:var(--coral);background:#fff2ef}.check{border:0;background:var(--blue);color:#fff;padding:9px 13px;border-radius:9px;font-weight:800;white-space:nowrap}.feedback{font-size:.77rem;color:var(--muted);line-height:1.25}.feedback.ok{color:var(--ok);font-weight:700}.feedback.no{color:var(--bad)}
.tutor{display:flex;flex-direction:column;overflow:hidden}.tutorhead{height:58px;flex:none;background:linear-gradient(135deg,#245b78,#23847e);color:#fff;padding:10px 13px;display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:10px;background:var(--sun);color:var(--nav);display:grid;place-items:center}.tutorhead h2{font-size:.95rem;margin:0}.tutorhead p{font-size:.7rem;margin:2px 0 0;color:#d9f1ef}.chat{flex:1;min-height:0;overflow:auto;padding:11px;background:#f5f9fa}.msg{max-width:93%;padding:8px 10px;border-radius:11px;margin-bottom:8px;font-size:.8rem;line-height:1.38;white-space:pre-wrap}.bot{background:#fff;border:1px solid var(--line);border-top-left-radius:3px}.user{margin-left:auto;background:#dff2ef;color:#15524e;border-top-right-radius:3px}.quick{flex:none;padding:8px;border-top:1px solid var(--line);display:flex;gap:5px;flex-wrap:wrap;background:#fff}.chip{border:1px solid #b8d9d5;background:#f2fbfa;color:#216862;border-radius:999px;padding:5px 8px;font-size:.68rem;font-weight:750}.composer{flex:none;display:flex;gap:7px;padding:8px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;border:2px solid #d4e0e6;border-radius:9px;padding:8px;outline:none}.composer input:focus{border-color:var(--aqua)}.send{width:39px;border:0;border-radius:9px;background:var(--aqua);color:#fff;font-weight:900}.toast{position:fixed;bottom:15px;left:50%;transform:translate(-50%,80px);background:var(--nav);color:white;padding:8px 12px;border-radius:9px;font-size:.8rem;transition:.2s}.toast.show{transform:translate(-50%,0)}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:calc(100vh - 54px);grid-template-columns:1fr}.work{height:720px}.tutor{height:600px}.privacy{display:none}}
@media(max-width:620px){header{height:auto;min-height:54px;flex-wrap:wrap;padding:8px 10px;gap:7px}.app{height:auto}.modes{order:3;width:100%}.mode{flex:1}.answer{grid-template-columns:auto 1fr}.feedback{grid-column:1/-1}.check{grid-column:1/-1}.work{height:760px}.drawhint{display:none}}
</style></head>
<body>
<header><h1>ƒ Geradewerkstatt</h1><nav class="modes"><button class="mode active" data-mode="line">Gerade gegeben</button><button class="mode" data-mode="points">Zwei Punkte</button></nav><span class="privacy">offline · keine Datenübertragung</span><button class="new" id="newTask">↻ Neue Aufgabe</button></header>
<main class="app">
<section class="panel work">
 <div class="taskbar"><strong>Bestimme y = mx + q.</strong><span id="taskText"></span></div>
 <div class="grapharea"><div class="canvaswrap"><canvas id="graph"></canvas><div class="tip" id="graphTip"></div></div><div class="tools"><button class="tool" id="triangleTool">△ Steigungsdreieck</button><button class="tool" id="pointsTool">● Hilfspunkte</button><button class="tool" id="clearTool">× Löschen</button><span class="drawhint" id="drawHint"></span></div></div>
 <div class="answer"><span class="label">m =</span><input id="mInput" inputmode="decimal" placeholder="z. B. −2/3"><span class="label">q =</span><input id="qInput" inputmode="decimal" placeholder="z. B. 2"><button class="check" id="checkBtn">Überprüfen</button><div class="feedback" id="feedback">Brüche sowie Punkt oder Komma sind möglich.</div></div>
</section>
<aside class="panel tutor"><div class="tutorhead"><div class="avatar">💡</div><div><h2>Lokaler Lerntutor</h2><p>Kennt Aufgabe, Zeichnung und Eingaben</p></div></div><div class="chat" id="chat"></div><div class="quick"><button class="chip" data-q="start">Wie beginne ich?</button><button class="chip" data-q="triangle">Steigungsdreieck</button><button class="chip" data-q="q">Wie finde ich q?</button><button class="chip" data-q="check">Prüfe meinen Ansatz</button></div><div class="composer"><input id="chatInput" placeholder="Frage zur Aufgabe …"><button class="send" id="sendBtn">↑</button></div></aside>
</main><div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],canvas=$('#graph'),ctx=canvas.getContext('2d');
const S={mode:'line',m:1,q:0,p1:null,p2:null,triangle:false,points:false,drag:false,a:null,b:null,valid:false,w:0,h:0,rangeX:8,rangeY:5};
const C={grid:'#dce7eb',axis:'#526b7b',line:'#256d9d',point:'#e66b55',tri:'#e4a82d',fill:'rgba(239,185,79,.23)',bad:'#e66b55',text:'#183047'};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1}function f(n,d){if(d<0){n=-n;d=-d}let g=gcd(n,d);return d/g===1?''+n/g:`${n/g}/${d/g}`}function shown(v){if(Number.isInteger(v))return''+v;for(let d=2;d<=8;d++){let n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return f(n,d)}return(+v.toFixed(3)+'').replace('.',',')}function parse(s){if(!s)return NaN;s=s.trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'');if(s.includes('/')){let z=s.split('/').map(Number);return z.length===2&&z[1]?z[0]/z[1]:NaN}return Number(s)}function near(a,b){return Number.isFinite(a)&&Math.abs(a-b)<.006}
function task(){let slopes=[[-3,1],[-2,1],[-3,2],[-1,2],[1,3],[1,2],[2,3],[1,1],[3,2],[2,1],[3,1]],z=slopes[Math.floor(Math.random()*slopes.length)];S.m=z[0]/z[1];S.q=Math.floor(Math.random()*7)-3;let x1=(Math.floor(Math.random()*5)-2)*z[1],x2=x1+z[1]*(Math.random()<.5?1:2);S.p1={x:x1,y:S.m*x1+S.q};S.p2={x:x2,y:S.m*x2+S.q};if(Math.abs(S.p1.y)>S.rangeY||Math.abs(S.p2.y)>S.rangeY){S.p1={x:0,y:S.q};S.p2={x:z[1],y:z[0]+S.q}}S.a=S.b=null;S.valid=S.triangle=S.points=false;$('#triangleTool').classList.remove('active');$('#pointsTool').classList.remove('active');$('#mInput').value=$('#qInput').value='';$('#mInput').className=$('#qInput').className='';$('#feedback').className='feedback';$('#feedback').textContent='Brüche sowie Punkt oder Komma sind möglich.';updateText();welcome();resize()}
function updateText(){if(S.mode==='line'){$('#taskText').innerHTML='Lies <b>m</b> und <b>q</b> aus der Darstellung ab.';$('#graphTip').textContent='Ziehe das Steigungsdreieck zwischen zwei Gitterpunkten.';$('#drawHint').textContent='m selbst als Δy/Δx berechnen.'}else{$('#taskText').innerHTML=`A(${S.p1.x}|${shown(S.p1.y)}), B(${S.p2.x}|${shown(S.p2.y)})`;$('#graphTip').textContent='Die Gerade ist nicht eingezeichnet.';$('#drawHint').textContent='Ziehe das Dreieck von A nach B.'}}
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);S.w=r.width;S.h=r.height;S.scale=Math.min(r.width/(S.rangeX*2+2),r.height/(S.rangeY*2+1));S.o={x:r.width/2,y:r.height/2};draw()}
function px(p){return{x:S.o.x+p.x*S.scale,y:S.o.y-p.y*S.scale}}function math(p){return{x:(p.x-S.o.x)/S.scale,y:(S.o.y-p.y)/S.scale}}function snap(p){p=math(p);return{x:Math.round(p.x),y:Math.round(p.y)}}function onLine(p){return Math.abs(p.y-(S.m*p.x+S.q))<.08}function same(a,b){return Math.abs(a.x-b.x)<.01&&Math.abs(a.y-b.y)<.01}
function dot(p,r,color,label){let z=px(p);ctx.beginPath();ctx.arc(z.x,z.y,r,0,7);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();if(label){ctx.fillStyle=C.text;ctx.font='700 12px system-ui';ctx.fillText(label,z.x+8,z.y-8)}}
function draw(){if(!S.w)return;ctx.clearRect(0,0,S.w,S.h);ctx.fillStyle='#fcfefe';ctx.fillRect(0,0,S.w,S.h);for(let x=-S.rangeX;x<=S.rangeX;x++){let a=px({x,y:-S.rangeY-1}),b=px({x,y:S.rangeY+1});ctx.strokeStyle=x?C.grid:C.axis;ctx.lineWidth=x?1:1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(x) {ctx.fillStyle='#748896';ctx.font='10px system-ui';ctx.fillText(x,a.x-3,S.o.y+13)}}for(let y=-S.rangeY;y<=S.rangeY;y++){let a=px({x:-S.rangeX-1,y}),b=px({x:S.rangeX+1,y});ctx.strokeStyle=y?C.grid:C.axis;ctx.lineWidth=y?1:1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(y){ctx.fillStyle='#748896';ctx.font='10px system-ui';ctx.fillText(y,S.o.x+5,a.y+3)}}ctx.fillStyle=C.axis;ctx.font='700 12px system-ui';ctx.fillText('x',S.w-13,S.o.y-7);ctx.fillText('y',S.o.x+7,13);
if(S.mode==='line'){let a=px({x:-S.rangeX-2,y:S.m*(-S.rangeX-2)+S.q}),b=px({x:S.rangeX+2,y:S.m*(S.rangeX+2)+S.q});ctx.save();ctx.beginPath();ctx.rect(0,0,S.w,S.h);ctx.clip();ctx.strokeStyle=C.line;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();if(S.points)for(let x=-S.rangeX;x<=S.rangeX;x++){let y=S.m*x+S.q;if(Number.isInteger(y)&&Math.abs(y)<=S.rangeY)dot({x,y},4,C.point)}}else{dot(S.p1,6,C.point,'A');dot(S.p2,6,C.point,'B')}if(S.a&&S.b)triangle(S.a,S.b,S.valid)}
function triangle(a,b,valid){let c={x:b.x,y:a.y},pa=px(a),pb=px(b),pc=px(c);ctx.fillStyle=valid?C.fill:'rgba(230,107,85,.14)';ctx.strokeStyle=valid?C.tri:C.bad;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pc.x,pc.y);ctx.lineTo(pb.x,pb.y);ctx.closePath();ctx.fill();ctx.stroke();dot(a,5,ctx.strokeStyle);dot(b,5,ctx.strokeStyle);ctx.fillStyle=C.text;ctx.font='700 12px system-ui';ctx.fillText(`Δx = ${b.x-a.x}`,(pa.x+pc.x)/2-17,pa.y+16);ctx.fillText(`Δy = ${b.y-a.y}`,pc.x+7,(pc.y+pb.y)/2)}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{if(!S.triangle)return;canvas.setPointerCapture(e.pointerId);S.drag=true;S.a=S.b=snap(pos(e));S.valid=false;draw()};canvas.onpointermove=e=>{if(S.drag){S.b=snap(pos(e));S.valid=false;draw()}};canvas.onpointerup=e=>{if(!S.drag)return;S.drag=false;S.b=snap(pos(e));let ends=S.mode==='line'?onLine(S.a)&&onLine(S.b):(same(S.a,S.p1)||same(S.a,S.p2))&&(same(S.b,S.p1)||same(S.b,S.p2));S.valid=S.a.x!==S.b.x&&ends;if(S.valid){$('#drawHint').textContent=`Δx = ${S.b.x-S.a.x}, Δy = ${S.b.y-S.a.y}. Berechne m.`;say(`Dein Dreieck passt. Du liest Δx = ${S.b.x-S.a.x} und Δy = ${S.b.y-S.a.y} ab. Welchen Quotienten bildest du?`)}else toast(S.mode==='line'?'Beide Endpunkte müssen auf der Geraden liegen.':'Ziehe direkt von A nach B.');draw()};
$('#triangleTool').onclick=()=>{S.triangle=!S.triangle;$('#triangleTool').classList.toggle('active',S.triangle);canvas.style.cursor=S.triangle?'crosshair':'default'};$('#pointsTool').onclick=()=>{S.points=!S.points;$('#pointsTool').classList.toggle('active',S.points);draw()};$('#clearTool').onclick=()=>{S.a=S.b=null;S.valid=false;draw()};$('#newTask').onclick=task;$$('.mode').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;$$('.mode').forEach(x=>x.classList.toggle('active',x===b));task()});
function check(){let m=parse($('#mInput').value),q=parse($('#qInput').value),mg=near(m,S.m),qg=near(q,S.q);$('#mInput').className=mg?'good':'bad';$('#qInput').className=qg?'good':'bad';let f=$('#feedback');f.className='feedback '+(mg&&qg?'ok':'no');if(mg&&qg){f.textContent=`Richtig: y = ${shown(S.m)}x ${S.q<0?'− '+shown(-S.q):'+ '+shown(S.q)}`;say('Beide Werte stimmen. Gut gelöst.')}else if(mg){f.textContent='m stimmt. Prüfe q.';say('m stimmt. Setze nun einen Punkt in y = mx + q ein oder lies den Schnittpunkt mit der y-Achse ab.')}else if(qg){f.textContent='q stimmt. Prüfe m.';say('q stimmt. Kontrolliere bei m noch Δy/Δx und das Vorzeichen.')}else{f.textContent='Noch nicht. Beginne mit m.';say(S.valid?'Nutze dein Dreieck: m ist Δy geteilt durch Δx.':'Zeichne ein Steigungsdreieck oder berechne die Koordinatenänderungen.')}}$('#checkBtn').onclick=check;
function say(t){let d=document.createElement('div');d.className='msg bot';d.textContent=t;$('#chat').appendChild(d);$('#chat').scrollTop=$('#chat').scrollHeight}function user(t){let d=document.createElement('div');d.className='msg user';d.textContent=t;$('#chat').appendChild(d)}function welcome(){$('#chat').innerHTML='';say(S.mode==='line'?'Neue Gerade. Suche zwei Gitterpunkte und bestimme daraus m. Ich helfe dir schrittweise, ohne die Lösung vorwegzunehmen.':'Neue Punktaufgabe. Berechne zuerst Δx und Δy von A nach B. Daraus bestimmst du m.')}
function reply(raw,key){let t=raw.toLowerCase(),m=parse($('#mInput').value),q=parse($('#qInput').value);if(key==='start'||/beginn|anfang|keine ahnung|weiss nicht|weiß nicht|weiter/.test(t))return S.mode==='line'?'Suche zwei Gitterpunkte auf der Geraden. Aktiviere bei Bedarf die Hilfspunkte und ziehe dann ein Steigungsdreieck.':'Berechne zuerst Δx = x_B − x_A und Δy = y_B − y_A. Danach gilt m = Δy/Δx.';if(key==='triangle'||/dreieck|delta|zeichnen/.test(t))return S.valid?'Das Dreieck passt. Teile die beschriftete vertikale Änderung durch die horizontale Änderung.':'Aktiviere „Steigungsdreieck“. '+(S.mode==='line'?'Ziehe zwischen zwei Gitterpunkten auf der Geraden.':'Ziehe direkt von A nach B.');if(key==='q'||/achsenabschnitt|\bq\b|y-achse/.test(t))return near(m,S.m)?'m stimmt. Setze nun einen Punkt in y = mx + q ein und löse nach q auf.':'Bestimme zuerst m. Danach setzt du einen bekannten Punkt in y = mx + q ein.';if(key==='check'||/prüf|stimmt|ansatz|richtig/.test(t)){if(!Number.isFinite(m)&&!Number.isFinite(q))return'Trage mindestens einen Wert ein.';if(near(m,S.m))return near(q,S.q)?'Beide Werte stimmen.':'m stimmt. Prüfe q mit q = y − mx.';if(Number.isFinite(m))return'm stimmt noch nicht. Prüfe Δy/Δx und das Vorzeichen.';return near(q,S.q)?'q stimmt. Jetzt fehlt m.':'q stimmt noch nicht.'}if(/negativ|vorzeichen|fallen/.test(t))return'Fällt die Gerade von links nach rechts, ist m negativ. Bilde beide Differenzen in derselben Richtung.';if(/steigung|\bm\b|bruch|quotient/.test(t))return S.valid?'Lies Δy und Δx am Dreieck ab und berechne m = Δy/Δx.':'Für m gilt Δy/Δx. Verwende bei beiden Differenzen dieselbe Punktereihenfolge.';if(/lösung|verrat|sag mir/.test(t))return'Ich nenne nicht sofort die fertige Lösung. Trage deinen Ansatz ein, dann prüfe ich ihn gezielt.';return'Gehe schrittweise vor: Punkte finden, Δx und Δy bestimmen, m berechnen, q ablesen oder einsetzen. Wo hängst du?'}
function send(text,key){text=text.trim();if(!text)return;user(text);setTimeout(()=>say(reply(text,key)),120);$('#chatInput').value=''}$('#sendBtn').onclick=()=>send($('#chatInput').value);$('#chatInput').onkeydown=e=>{if(e.key==='Enter')send(e.target.value)};$$('.chip').forEach(b=>b.onclick=()=>send(b.textContent,b.dataset.q));function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}window.addEventListener('resize',resize);task();
</script></body></html>
