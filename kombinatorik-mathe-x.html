<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;

</head>
<body>
    <div id="root"></div>

        const { useState } = React;

        const ChevronRight = () => (

            </svg>
        );

        const AlertCircle = () => (

        );

            </svg>
        );

        const MissionMatheX = () => {
            const [gameStarted, setGameStarted] = useState(false);
            const [currentRoom, setCurrentRoom] = useState(0);
            const [userAnswer, setUserAnswer] = useState('');
            const [showHint, setShowHint] = useState(false);
            const [feedback, setFeedback] = useState('');
            const [completedRooms, setCompletedRooms] = useState([]);

                    question: "Wie viele verschiedene Farbsequenzen sind möglich?",
                    answer: 125,
                    hint: "3 Positionen, jeweils 5 Farben zur Auswahl, Wiederholung erlaubt, Reihenfolge wichtig.",
                    explanation: "Geordnete Stichprobe mit Wiederholung: 5³ = 125"
                },
                // Phase 2
                {
                    phase: 2,

                    story: "Im Labor hängen 8 verschiedene Schlüssel an einer Wand. Du musst drei davon nacheinander ausprobieren. Jeden Schlüssel kannst du nur einmal verwenden, und du merkst dir die Reihenfolge, in der du sie testest.",
                    question: "Wie viele verschiedene Versuche sind maximal möglich?",
                    answer: 336,
                    hint: "3 aus 8 Schlüsseln, Reihenfolge wichtig, keine Wiederholung. Das ist eine Variation.",

                },
                {

                    question: "Wie viele verschiedene Auswahlen sind möglich?",
                    answer: 210,
                    hint: "4 aus 10 auswählen, Reihenfolge egal, keine Wiederholung.",
                    explanation: "Ungeordnete Stichprobe ohne Wiederholung: C(10,4) = 210"
                },
                {
                    phase: 2,
                    title: "👥 Team-Aufstellung",
                    story: "Für die nächste Phase müssen 6 Teammitglieder hintereinander durch einen schmalen Gang gehen. Jeder hat eine Position von 1 bis 6. Alle 6 Personen sind verschieden und jede Position wird genau einmal besetzt.",
                    question: "Wie viele verschiedene Aufstellungen gibt es?",

                    hint: "Alle 6 Personen werden angeordnet. Jede Reihenfolge zählt.",
                    explanation: "Geordnete Stichprobe ohne Wiederholung: 6! = 720"
                },
                {
                    phase: 2,
                    title: "🧪 Chemische Mischung",
                    story: "Du stehst vor einem Regal mit 7 chemischen Substanzen. Du musst genau 5 Portionen in einen Behälter geben. Du kannst von jeder Substanz mehrere Portionen nehmen. Der Behälter vermischt alles automatisch, sodass nur zählt, welche Substanzen und wie oft du sie gewählt hast – nicht die Reihenfolge der Zugabe.",
                    question: "Wie viele verschiedene Mischungen sind möglich?",
                    answer: 462,
                    hint: "5 Elemente aus 7, mit Wiederholung, ohne Reihenfolge.",
                    explanation: "Ungeordnete Stichprobe mit Wiederholung: C(7+5-1, 5) = C(11,5) = 462"
                },
                {
                    phase: 2,
                    title: "🔢 Zahlenschloss Matrix",
                    story: "Die Formel ist hinter einem dreistelligen Zahlenschloss gesichert. Jede Stelle zeigt die Ziffern 1 bis 6 an. Du kannst jede Ziffer an jeder Stelle wählen – auch mehrmals die gleiche Ziffer.",
                    question: "Wie viele Kombinationen musst du im schlimmsten Fall probieren?",
                    answer: 216,
                    hint: "3 Stellen, jeweils 6 Ziffern möglich, Wiederholung erlaubt, Reihenfolge wichtig.",
                    explanation: "Geordnete Stichprobe mit Wiederholung: 6³ = 216"
                },
                // Phase 3
                {
                    phase: 3,
                    title: "🚪 Fluchtroute",
                    story: "Es gibt 9 verschiedene Ausgänge im Gebäude. Du musst nacheinander durch 4 davon gehen. Durch denselben Ausgang kannst du nicht zweimal gehen. Die Reihenfolge, in der du sie passierst, ist entscheidend für die Route.",
                    question: "Wie viele verschiedene Routen sind möglich?",
                    answer: 3024,
                    hint: "4 aus 9 Ausgängen, Reihenfolge wichtig, keine Wiederholung.",
                    explanation: "Geordnete Stichprobe ohne Wiederholung: 9×8×7×6 = 3024"
                },
                {
                    phase: 3,
                    title: "🚗 Fahrzeugauswahl",
                    story: "In der Garage stehen 12 verschiedene Fahrzeuge. Du musst 5 davon für dein Team reservieren. Es ist egal, in welcher Reihenfolge du sie auswählst – du nimmst einfach 5 Fahrzeuge mit. Jedes Fahrzeug kann nur einmal gewählt werden.",

                    answer: 792,
                    hint: "5 aus 12, ohne Reihenfolge, keine Wiederholung.",
                    explanation: "Ungeordnete Stichprobe ohne Wiederholung: C(12,5) = 792"
                },
                {
                    phase: 3,
                    title: "📋 Notfall-Protokoll",
                    story: "Der Fluchtplan besteht aus 7 verschiedenen Schritten. Jeder Schritt muss genau einmal ausgeführt werden. Du musst alle 7 Schritte in eine bestimmte Reihenfolge bringen – aber nur eine davon ist korrekt.",
                    question: "Wie viele falsche Reihenfolgen gibt es insgesamt?",
                    answer: 5039,
                    hint: "Es gibt 7! mögliche Reihenfolgen insgesamt. Nur eine davon ist richtig. Wie viele sind falsch?",
                    explanation: "Alle Permutationen minus die richtige: 7! - 1 = 5040 - 1 = 5039"
                },
                {
                    phase: 3,
                    title: "📡 Funkfrequenzen",
                    story: "Du musst eine vierstellige Funkfrequenz einstellen. Für jede der vier Stellen kannst du aus 8 verschiedenen Kanälen wählen. Jeder Kanal kann an mehreren Stellen verwendet werden. Die Position jedes Kanals ist wichtig.",
                    question: "Wie viele verschiedene Frequenzen sind theoretisch möglich?",
                    answer: 4096,
                    hint: "4 Positionen, 8 Kanäle pro Position, Wiederholung erlaubt, Reihenfolge zählt.",
                    explanation: "Geordnete Stichprobe mit Wiederholung: 8⁴ = 4096"
                },
                {
                    phase: 3,
                    title: "🎯 Finale Tür",
                    story: "Die letzte Tür! Vor dir liegen 5 verschiedene Schlüsselkarten. Du musst genau 2 davon gleichzeitig in den Scanner legen. Es spielt keine Rolle, welche du zuerst einlegst – das System erkennt nur, welche zwei Karten du verwendest. Jede Karte kann nur einmal benutzt werden.",
                    question: "Wie viele Kombinationen musst du im schlimmsten Fall ausprobieren?",
                    answer: 10,
                    hint: "2 aus 5 auswählen, Reihenfolge egal, keine Wiederholung.",
                    explanation: "Ungeordnete Stichprobe ohne Wiederholung: C(5,2) = 10"
                }
            ];

            const checkAnswer = () => {
                const currentRoomData = rooms[currentRoom];
                const userNum = parseInt(userAnswer);
                
                if (userNum === currentRoomData.answer) {
                    setFeedback('correct');
                    setCompletedRooms([...completedRooms, currentRoom]);
                    
                    setTimeout(() => {
                        if (currentRoom === rooms.length - 1) {
                            setGameComplete(true);
                        } else if (currentRoom === 4) {
                            setShowPhaseTransition(true);
                            setCurrentPhase(2);
                        } else if (currentRoom === 9) {
                            setShowPhaseTransition(true);
                            setCurrentPhase(3);
                        } else {
                            setCurrentRoom(currentRoom + 1);
                            setUserAnswer('');
                            setFeedback('');
                            setShowHint(false);
                        }
                    }, 2000);
                } else {
                    setFeedback('incorrect');
                    const newLives = lives - 1;
                    setLives(newLives);
                    
                    if (newLives === 0) {
                        setTimeout(() => {
                            setGameOver(true);
                        }, 1500);
                    } else {
                        setTimeout(() => setFeedback(''), 2000);
                    }
                }
            };

            const getPhaseInfo = (phase) => {
                const phaseNames = {
                    1: "Phase 1: Eindringen",
                    2: "Phase 2: Bergung", 
                    3: "Phase 3: Flucht"
                };
                return phaseNames[phase];
            };

            if (!gameStarted) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-800 flex items-center justify-center p-4">
                        <div className="max-w-3xl bg-black bg-opacity-70 rounded-lg shadow-2xl p-8 backdrop-blur border-2 border-purple-500">
                            <div className="text-center mb-6">
                                <div className="text-6xl mb-4">🕵️</div>
                                <h1 className="text-4xl font-bold text-purple-300 mb-2">STRENG GEHEIM</h1>
                                <p className="text-red-400 text-sm font-mono">KLASSIFIZIERUNG: TOP SECRET</p>
                            </div>
                            
                            <div className="bg-purple-950 bg-opacity-50 border border-purple-500 rounded-lg p-6 mb-6">
                                <h2 className="text-2xl font-bold text-white mb-4 flex items-center">
                                    <span className="mr-3">📨</span> Mission: MatheX
                                </h2>
                                
                                <div className="text-gray-300 space-y-4 leading-relaxed">
                                    <p>
                                        <strong className="text-purple-300">Agent,</strong> du wurdest für eine Mission von höchster Priorität ausgewählt.
                                    </p>
                                    
                                    <p>
                                        Im Zentrum der Stadt befindet sich ein Hochsicherheitsgebäude der Organisation "Sigma Corp". 
                                        Tief in diesem Komplex wird die <strong className="text-yellow-300">Universalformel X</strong> aufbewahrt – 
                                        eine mathematische Entdeckung, die das Potential hat, die Welt zu verändern.
                                    </p>
                                    
                                    <p>Deine Mission besteht aus drei Phasen:</p>
                                    
                                    <div className="bg-black bg-opacity-40 rounded p-4 space-y-2 border-l-4 border-purple-500">
                                        <p>🔓 <strong>Phase 1: EINDRINGEN</strong> – Überwinde die äußeren Sicherheitssysteme</p>
                                        <p>💎 <strong>Phase 2: BERGUNG</strong> – Dringe ins Labor vor und sichere die Formel</p>
                                        <p>🏃 <strong>Phase 3: FLUCHT</strong> – Entkommen mit der Formel</p>
                                    </div>
                                    
                                    <p>
                                        Jede Phase enthält mehrere Hindernisse. Du musst kombinatorische Berechnungen durchführen, 
                                        um die Sicherheitssysteme zu überwinden. Ein falscher Zug könnte Alarm auslösen.
                                    </p>
                                    
                                    <div className="bg-red-900 bg-opacity-30 border border-red-500 rounded p-3 mt-4">
                                        <p className="text-red-300 font-semibold">⚠️ WARNUNG</p>
                                        <p className="text-sm text-gray-300">
                                            Du hast nur <strong className="text-red-400">3 Versuche</strong>. 
                                            Bei drei Fehlversuchen wird die Mission abgebrochen und du musst von vorne beginnen.
                                        </p>
                                    </div>
                                    
                                    <p className="text-purple-300 font-semibold mt-6">
                                        Die Zeit läuft. Bist du bereit, Agent?
                                    </p>
                                </div>
                            </div>
                            
                            <button
                                onClick={() => setGameStarted(true)}
                                className="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-4 px-8 rounded-lg transition-all transform hover:scale-105 shadow-lg"
                            >
                                <span className="text-xl">🚀 Mission starten</span>
                            </button>
                        </div>
                    </div>
                );
            }

            if (showPhaseTransition) {
                const phaseInfo = {
                    2: {
                        emoji: "💎",
                        title: "PHASE 1 ABGESCHLOSSEN",
                        subtitle: "Eindringen erfolgreich",
                        message: "Hervorragend, Agent! Du hast die äußeren Sicherheitssysteme überwunden und bist ins Gebäude eingedrungen.",

                        nextDescription: "Jetzt beginnt der kritische Teil der Mission. Du musst tiefer ins Gebäude vordringen, das Hochsicherheitslabor erreichen und die Universalformel X sichern. Die Systeme werden komplexer und die Berechnungen anspruchsvoller.",
                        roomsCompleted: 5,
                        roomsTotal: 15,
                        color: "emerald"
                    },
                    3: {
                        emoji: "🏃",
                        title: "PHASE 2 ABGESCHLOSSEN",
                        subtitle: "Formel gesichert",
                        message: "Ausgezeichnet! Du hast die Universalformel X in deinen Besitz gebracht. Das Schwierigste liegt hinter dir, aber die Mission ist noch nicht beendet.",
                        nextPhase: "PHASE 3: FLUCHT",
                        nextDescription: "Jetzt musst du mit der Formel aus dem Gebäude entkommen. Die Sicherheitskräfte sind alarmiert und jeder Fehler könnte dich verraten. Konzentriere dich – nur noch wenige Hindernisse trennen dich von der erfolgreichen Flucht!",
                        roomsCompleted: 10,
                        roomsTotal: 15,
                        color: "orange"
                    }
                };

                const info = phaseInfo[currentPhase];

                return (
                    <div className="min-h-screen bg-gradient-to-br from-emerald-900 via-gray-900 to-black flex items-center justify-center p-4">
                        <div className="max-w-3xl bg-black bg-opacity-80 rounded-lg shadow-2xl p-8 backdrop-blur border-2 border-green-500">
                            <div className="text-center mb-6">
                                <div className="text-7xl mb-4">{info.emoji}</div>
                                <h1 className="text-4xl font-bold text-green-300 mb-2">{info.title}</h1>
                                <p className="text-green-400 text-lg font-semibold">{info.subtitle}</p>
                            </div>

                                <p className="text-gray-300 text-lg mb-4 leading-relaxed">
                                    {info.message}
                                </p>
                                
                                <div className="bg-black bg-opacity-40 rounded p-4 mb-4">
                                    <div className="flex justify-between items-center text-gray-300 mb-2">
                                        <span>Fortschritt:</span>
                                        <span className="font-bold text-green-400">{info.roomsCompleted} / {info.roomsTotal} Räume</span>
                                    </div>
                                    <div className="w-full bg-gray-700 rounded-full h-3">

                                            style={{width: `${(info.roomsCompleted / info.roomsTotal) * 100}%`}}
                                        />
                                    </div>
                                </div>

                            >

                            <div className="text-6xl mb-4">🚨</div>
                            <h1 className="text-4xl font-bold text-red-400 mb-4">MISSION FEHLGESCHLAGEN</h1>

                            </p>

                                    setGameStarted(false);
                                    setCurrentRoom(0);
                                    setCompletedRooms([]);
                                    setGameOver(false);
                                    setLives(3);
                                    setUserAnswer('');
                                    setFeedback('');
                                    setShowHint(false);
                                    setShowPhaseTransition(false);
                                    setCurrentPhase(1);
                                }}
                                className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg transition-colors"
                            >

                            </button>
                        </div>
                    </div>
                );
            }

            if (gameComplete) {

                            <div className="text-7xl mb-4">🏆</div>
                            <h1 className="text-4xl font-bold text-green-300 mb-4">MISSION ERFOLGREICH!</h1>
                            <p className="text-xl text-gray-300 mb-6">
                                Hervorragende Arbeit, Agent! Du hast die Universalformel X geborgen und bist erfolgreich entkommen.
                            </p>
                            <div className="bg-green-950 bg-opacity-50 border-2 border-green-500 rounded-lg p-6 mb-6">
                                <div className="text-6xl mb-4">📐</div>
                                <p className="text-lg font-semibold text-green-300 mb-3">
                                    Die Formel der Freiheit ist gesichert!
                                </p>
                                <p className="text-gray-300 mb-4">
                                    Alle 15 Sicherheitssysteme überwunden
                                </p>
                                <div className="flex justify-center items-center gap-4 text-yellow-400 mb-4">
                                    <span className="text-3xl">❤️</span>
                                    <span className="text-xl font-bold">× {lives}</span>
                                    <span className="text-sm text-gray-400">Leben übrig</span>
                                </div>
                                <div className="bg-black bg-opacity-40 rounded p-4 mt-4">
                                    <p className="text-gray-300 text-sm mb-2">Du hast alle vier Kombinatorik-Typen gemeistert:</p>
                                    <ul className="text-left text-gray-400 text-sm space-y-1 max-w-md mx-auto">
                                        <li>✓ Geordnete Stichprobe mit Wiederholung</li>
                                        <li>✓ Geordnete Stichprobe ohne Wiederholung</li>
                                        <li>✓ Ungeordnete Stichprobe mit Wiederholung</li>
                                        <li>✓ Ungeordnete Stichprobe ohne Wiederholung</li>
                                    </ul>
                                </div>
                            </div>
                            <button
                                onClick={() => {
                                    setGameStarted(false);
                                    setCurrentRoom(0);
                                    setCompletedRooms([]);
                                    setGameComplete(false);
                                    setLives(3);
                                    setUserAnswer('');
                                    setFeedback('');
                                    setShowHint(false);
                                    setShowPhaseTransition(false);
                                    setCurrentPhase(1);
                                }}
                                className="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold py-3 px-8 rounded-lg transition-all transform hover:scale-105"
                            >
                                🔄 Neue Mission starten
                            </button>
                        </div>
                    </div>
                );
            }

            const currentRoomData = rooms[currentRoom];
            const progress = ((currentRoom) / rooms.length) * 100;

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-800 p-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-black bg-opacity-60 rounded-lg p-4 mb-4 backdrop-blur border border-blue-500">
                            <h1 className="text-3xl font-bold text-center text-blue-300 mb-2 flex items-center justify-center">
                                <span className="mr-3">🎯</span> Mission: MatheX
                            </h1>
                            <p className="text-center text-gray-400 text-sm">Die Formel der Freiheit</p>
                            
                            <div className="flex justify-center items-center gap-2 mt-3">
                                {[...Array(3)].map((_, i) => (
                                    <span key={i} className="text-2xl">
                                        {i < lives ? '❤️' : '🖤'}
                                    </span>
                                ))}
                            </div>
                            
                            <div className="mt-4">
                                <div className="flex justify-between text-xs text-gray-300 mb-1">
                                    <span>{getPhaseInfo(currentRoomData.phase)}</span>
                                    <span>Raum {currentRoom + 1} von {rooms.length}</span>
                                </div>
                                <div className="w-full bg-gray-700 rounded-full h-3 border border-gray-600">
                                    <div 
                                        className="bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 h-3 rounded-full transition-all duration-500"
                                        style={{width: `${progress}%`}}
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-lg shadow-2xl p-8 border-2 border-gray-700">
                            <div className="flex items-center mb-6 pb-4 border-b border-gray-700">
                                <div className="text-4xl mr-4">🔒</div>
                                <h2 className="text-2xl font-bold text-gray-100">
                                    {currentRoomData.title}
                                </h2>
                            </div>

                            <div className="bg-blue-950 bg-opacity-40 border-l-4 border-blue-500 p-5 mb-6 rounded-r">
                                <p className="text-gray-300 leading-relaxed">
                                    {currentRoomData.story}
                                </p>
                            </div>

                            <div className="mb-6">
                                <h3 className="text-xl font-semibold text-yellow-300 mb-4 flex items-center">
                                    <span className="mr-2">❓</span>
                                    {currentRoomData.question}
                                </h3>
                                
                                <input
                                    type="number"
                                    value={userAnswer}
                                    onChange={(e) => setUserAnswer(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && checkAnswer()}
                                    placeholder="Deine Antwort eingeben..."
                                    className="w-full px-4 py-3 bg-gray-800 border-2 border-gray-600 text-white rounded-lg focus:border-blue-500 focus:outline-none text-lg"
                                />
                            </div>

                            {feedback === 'correct' && (
                                <div className="bg-green-900 bg-opacity-50 border-2 border-green-500 rounded-lg p-4 mb-4 flex items-start">
                                    <div className="mr-3 mt-1"><Unlock /></div>
                                    <div>
                                        <p className="text-green-300 font-semibold mb-2">✅ Richtig! Tür geöffnet!</p>
                                        <p className="text-sm text-green-200">{currentRoomData.explanation}</p>
                                    </div>
                                </div>
                            )}

                            {feedback === 'incorrect' && (
                                <div className="bg-red-900 bg-opacity-50 border-2 border-red-500 rounded-lg p-4 mb-4 flex items-center">
                                    <div className="mr-3"><AlertCircle /></div>
                                    <div>
                                        <p className="text-red-300 font-semibold">❌ Falsch! Versuche es nochmal.</p>
                                        <p className="text-sm text-red-200 mt-1">Noch {lives} Leben übrig</p>
                                    </div>
                                </div>
                            )}

                            {showHint && (
                                <div className="bg-yellow-900 bg-opacity-40 border-2 border-yellow-600 rounded-lg p-4 mb-4">
                                    <div className="flex items-start">
                                        <div className="mr-3 mt-1"><Lightbulb /></div>
                                        <p className="text-yellow-100">{currentRoomData.hint}</p>
                                    </div>
                                </div>
                            )}

                            <div className="flex gap-3">
                                <button
                                    onClick={checkAnswer}
                                    disabled={!userAnswer}
                                    className="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:from-gray-600 disabled:to-gray-600 text-white font-bold py-3 px-6 rounded-lg transition-all flex items-center justify-center transform hover:scale-105 disabled:transform-none"
                                >
                                    <span className="mr-2">🔓</span>
                                    Code eingeben
                                    <span className="ml-2"><ChevronRight /></span>
                                </button>
                                
                                <button
                                    onClick={() => setShowHint(!showHint)}
                                    className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded-lg transition-all flex items-center transform hover:scale-105"
                                >
                                    <span className="mr-2"><Lightbulb /></span>
                                    Tipp
                                </button>
                            </div>
                        </div>

                        <div className="mt-4 text-center text-gray-400 text-sm flex items-center justify-center gap-2">
                            <span>🔓</span>
                            <span>Gelöste Räume: {completedRooms.length} / {rooms.length}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MissionMatheX />);
    </script>
</body>
</html>
