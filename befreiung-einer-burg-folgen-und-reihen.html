<!DOCTYPE html>

<title>Befreiung einer Burg</title>
<style>
:root{--bg:#efe3c8;--fg:#3b2a1a;--card:#fffaf0;--ac:#9c5a1c;--ln:#cdb88f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#241c14;--fg:#f1e6d0;--card:#33281c;--ac:#e0a85a;--ln:#5a4630}
html{height:100%}body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,"Times New Roman",serif}
#hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px;max-width:900px;margin:0 auto}
#hud span{margin-right:8px}
button{font:inherit;background:var(--card);color:var(--fg);border:2px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover,button.sel{border-color:var(--ac)}button:focus-visible,input:focus-visible{outline:3px solid var(--ac)}
button.go{background:var(--ac);color:#fff;border-color:var(--ac)}button.op{display:block;margin:6px 0;width:100%;text-align:left}
#wrap{position:relative;max-width:900px;margin:0 auto}
canvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--ln);border-radius:10px;touch-action:none;box-sizing:border-box}
#eb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ac);color:#fff;border-color:#fff;font-weight:bold}
#tt{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--ac);border-radius:8px;padding:6px 14px;max-width:90%;text-align:center}
[hidden]{display:none!important}
#m{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}
.card{background:var(--card);border:3px solid var(--ln);border-radius:12px;padding:16px 20px;max-width:540px;width:100%;max-height:85vh;overflow:auto}
.card h2,.card h3,.card h4{margin:.2em 0 .4em}.fm{font:italic 1.1em Georgia,serif;background:rgba(156,90,28,.12);padding:4px 10px;border-radius:6px}
.hint{background:rgba(224,168,90,.25);padding:4px 10px;border-radius:6px}.sm{font-size:.85em;opacity:.8}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:0 4px;border:3px solid var(--ln);cursor:pointer;vertical-align:middle}.sw.sel{border-color:var(--fg)}
input{font:inherit;padding:6px;border:2px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);max-width:60%}
#lv{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto}.lvc{max-width:980px;margin:0 auto;padding:12px 16px 40px}.lvh{display:flex;justify-content:space-between;align-items:center;gap:10px}#lv table{border-collapse:collapse;font-size:.85em;width:100%}#lv td,#lv th{border:1px solid var(--ln);padding:4px 6px;vertical-align:top;text-align:left}#lv details{border:1px solid var(--ln);border-radius:8px;margin:8px 0;padding:6px 10px;background:var(--card)}#lv summary{cursor:pointer;font-weight:bold}#lv .tw{overflow-x:auto}#lv textarea,#lv input[type=text]{width:100%;max-width:none;box-sizing:border-box;font:inherit;padding:6px;border:2px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg)}#lv select{font:inherit;padding:4px;background:var(--bg);color:var(--fg);border:2px solid var(--ln);border-radius:6px}#lv .lvb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}#lv tr.t0 td{border-top:2px solid var(--ac)}a{color:var(--ac)}#hlp{max-width:900px;margin:6px auto;padding:0 10px;font-size:.85em;opacity:.8;text-align:center}
</style></head><body>
<div id="hud"><span>💰 <b id="tl">5</b> Taler</span><span id="hs"></span><button onclick="codex(0)">📖 Codex</button><button onclick="rules()" aria-label="Spielregeln">❓</button><button id="snd" onclick="toggleSnd()" aria-label="Ton an/aus">🔊</button><button onclick="neu()">⟲ Neu</button></div>
<div id="wrap"><canvas id="c" width="800" height="500" aria-label="Spielwelt"></canvas><button id="eb" hidden="" onclick="go()">Betreten</button><div id="tt" hidden=""></div></div>
<p id="hlp">Steuerung: WASD oder Pfeiltasten, tippen oder klicken zum Laufen. Karte verschieben: Maus ziehen oder zwei Finger. E oder der Knopf zum Betreten. Taschenrechner: dein eigener.</p>
<div id="lv" hidden=""></div><div id="m" hidden=""></div>
<script>
/* ===== INHALTSBLOCK (Schülerfassung) ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const INHALT={thema:"Folgen und Reihen",intro:"Die Burg Falkenstein, dein Zuhause, wurde von Räubern besetzt. {Gefangene1} sitzt gefangen im Turm. Du hast nur 5 Taler, {Name}, und musst dich unterwegs ausrüsten: mit einem Pferd, einer Waffe, einer Wegkarte und einem Schild. Taler verdienst du mit richtig gelösten Aufgaben. Hinweise kosten Taler. Dein erstes Ziel ist das Wirtshaus. Die Wirtin weiss, was auf der Burg los ist.",stationen:[
    {ort:"Wirtshaus",figur:"Wirtin",emoji:"🍺",ziel:"Pferd",zu:"",text:"Die Wirtin sagt: «Setz dich, {Name}, und hör gut zu. Eine Folge ist eine Liste von Zahlen a₁, a₂, a₃, … Bei einer arithmetischen Folge ist der Abstand d zwischen zwei Nachbarn immer gleich: 4, 7, 10, 13, … hat d = 3. Das n-te Glied rechnest du direkt aus, und mit einer Umformung findest du auch die Anzahl Glieder.»",formeln:["aₙ = a₁ + (n − 1) · d","n = (aₙ − a₁) / d + 1","d = a₂ − a₁"],links:[
        {t:"Wikipedia: Arithmetische Folge",u:"https://de.wikipedia.org/wiki/Arithmetische_Folge"}
      ],aufgaben:[
        {typ:"zahl",gen:()=>{const a=R(5,40),d=R(3,19),n=R(15,45),v=a+(n-1)*d;return{f:`Die Wirtin stapelt Fässer in Reihen. In der 1. Reihe liegen ${a}, jede weitere Reihe hat ${d} mehr. Wie viele Fässer liegen in der ${n}. Reihe?`,l:v,w:`aₙ = ${a} + (${n} − 1)·${d} = ${v}`,h:["Gesucht ist ein Glied aₙ. Schau im Codex nach der passenden Formel.",`Setze ein: a₁ = ${a}, d = ${d}, n = ${n}.`]}}},
        {typ:"zahl",gen:()=>{const a=R(4,30),d=R(3,12),n=R(20,60),v=a+(n-1)*d;return{f:`Im Wirtshaus stehen Tische in einer Reihe. Der 1. Tisch hat ${a} Plätze, jeder weitere ${d} mehr, der letzte hat ${v} Plätze. Wie viele Tische gibt es?`,l:n,w:`n = (${v} − ${a}) / ${d} + 1 = ${n}`,h:["Gesucht ist die Anzahl Glieder n. Forme die Formel für aₙ nach n um.",`Setze ein: aₙ = ${v}, a₁ = ${a}, d = ${d}.`]}}},
        {typ:"mc",f:"Welche dieser Folgen ist arithmetisch?",opts:["3, 7, 11, 15, …","2, 4, 8, 16, …","1, 4, 9, 16, …"],l:0,w:"Bei 3, 7, 11, 15 ist die Differenz immer 4. Bei den anderen ändert sie sich oder es wird multipliziert.",h:["Berechne jeweils die Differenz benachbarter Glieder.","Die Differenz muss immer gleich sein."]},
        {typ:"wf",f:"Bei einer arithmetischen Folge ist die Differenz zweier benachbarter Glieder immer gleich.",l:true,w:"Genau das ist die Definition: aₙ₊₁ − aₙ = d.",h:["Denk an die Bedeutung von d.","d ist die Differenz."]},
        {typ:"mc",f:"Wie lautet die Formel für das n-te Glied einer arithmetischen Folge?",opts:["aₙ = a₁ + (n − 1) · d","aₙ = a₁ · qⁿ⁻¹","aₙ = a₁ + n · d²"],l:0,w:"Zum ersten Glied addierst du (n − 1)-mal die Differenz d.",h:["Wie oft musst du d addieren, um vom 1. zum n-ten Glied zu kommen?","Es sind (n − 1) Schritte."]},
        {typ:"wf",f:"Die Folge 5, 8, 12, 17, … ist arithmetisch.",l:false,w:"Die Differenzen sind 3, 4, 5. Sie sind nicht konstant.",h:["Berechne die Differenzen benachbarter Glieder.","Sind alle gleich?"]},
        {typ:"zahl",gen:()=>{const a=R(5,50),d=R(3,17),n=R(12,40),v=a+(n-1)*d;return{f:`Der Turm der Kirche hat ${n} Stufen. Die erste Stufe liegt ${a} cm über dem Boden, die letzte ${v} cm. Jede Stufe steigt um gleich viele cm. Wie viele cm sind das?`,l:d,w:`d = (aₙ − a₁)/(n − 1) = (${v} − ${a})/(${n} − 1) = ${d}`,h:["Gesucht ist die Differenz d. Forme aₙ = a₁ + (n − 1)·d nach d um.",`Setze ein: aₙ = ${v}, a₁ = ${a}, n = ${n}.`]}}},
        {typ:"zahl",gen:()=>{const a=R(5,40),d=R(3,15),m=R(3,6),p=R(11,16),k=R(25,45);return{f:`Am Fischersteg steigt der Boden gleichmässig an. Die ${m}. Planke liegt ${a+(m-1)*d} cm hoch, die ${p}. Planke ${a+(p-1)*d} cm. Auf welcher Höhe in cm liegt die ${k}. Planke?`,l:a+(k-1)*d,w:`d = (${a+(p-1)*d} − ${a+(m-1)*d})/(${p} − ${m}) = ${d}; a₁ = ${a}; a${k} = ${a} + ${k-1}·${d} = ${a+(k-1)*d}`,h:["Bestimme zuerst d aus den zwei gegebenen Gliedern: d = (aₚ − aₘ)/(p − m).","Berechne danach a₁ und dann das gesuchte Glied."]}}},
        {typ:"mc",f:"Für die Folge 20, 17, 14, 11, … gilt:",opts:["d = −3, die Folge ist fallend","d = 3, die Folge ist fallend","d = −3, die Folge ist steigend"],l:0,w:"Jedes Glied ist um 3 kleiner als das vorherige, also d = −3. Die Folge fällt.",h:["Berechne a₂ − a₁.","Ein negatives d bedeutet: fallende Folge."]},
        {typ:"wf",f:"Eine arithmetische Folge mit d < 0 ist fallend.",l:true,w:"Bei negativem d wird jedes Glied kleiner als das vorherige.",h:["Was bewirkt es, wenn du ein negatives d addierst?","Addieren einer negativen Zahl verkleinert."]}
      ]},
    {ort:"Schmiede",figur:"Schmied",emoji:"🔨",ziel:"Waffe",zu:"Die Schmiede ist verriegelt und die Esse kalt. Besorg dir zuerst ein Pferd im Wirtshaus.",text:"Der Schmied brummt: «Gutes Eisen entsteht durch Falten, {Name}. Jede Faltung vervielfacht die Lagen, immer mit demselben Faktor. Das ist eine geometrische Folge: Du multiplizierst jedes Glied mit demselben Faktor q. Beispiel: 3, 6, 12, 24, … hat q = 2.»",formeln:["aₙ = a₁ · qⁿ⁻¹","q = aₙ₊₁ / aₙ","n =log_q(aₙ / a₁) + 1"],links:[
        {t:"Wikipedia: Geometrische Folge",u:"https://de.wikipedia.org/wiki/Geometrische_Folge"}
      ],aufgaben:[
        {typ:"zahl",gen:()=>{const a=R(3,12),q=R(2,4),n=R(6,9),v=a*q**(n-1);return{f:`Der Schmied faltet Stahl: Die erste Stufe hat ${a} Lagen, mit jeder weiteren Stufe multipliziert sich die Anzahl mit ${q}. Wie viele Lagen hat die ${n}. Stufe?`,l:v,w:`aₙ = ${a} · ${q}^(${n} − 1) = ${v}`,h:["Gesucht ist ein Glied aₙ einer geometrischen Folge. Die Formel steht im Codex.",`Setze ein: a₁ = ${a}, q = ${q}, n = ${n}. Rechne zuerst die Potenz ${q}^${n-1}.`]}}},
        {typ:"zahl",gen:()=>{const a=R(2,9),q=R(2,4),n=R(5,9),v=a*q**(n-1);return{f:`Die Esse wird mit Kohle gefüttert. Die erste Fuhre wiegt ${a} kg, jede weitere das ${q}-Fache der vorherigen. Die letzte Fuhre wiegt ${v} kg. Wie viele Fuhren waren es?`,l:n,w:`${v} = ${a} · ${q}^(n − 1), also ${q}^(n − 1) = ${v/a}, also n − 1 = ${n-1}, also n = ${n}`,h:["Gesucht ist die Anzahl Glieder n. Teile zuerst aₙ durch a₁.",`Du suchst die Potenz: ${q}^(n − 1) = ${v/a}. Probiere ${q}^1, ${q}^2, …`]}}},
        {typ:"mc",f:"Welche dieser Folgen ist geometrisch?",opts:["2, 6, 18, 54, …","2, 5, 8, 11, …","1, 4, 9, 16, …"],l:0,w:"Bei 2, 6, 18, 54 ist der Quotient immer 3. Die zweite Folge ist arithmetisch (d = 3), die dritte besteht aus Quadratzahlen.",h:["Berechne jeweils den Quotienten benachbarter Glieder.","Beim richtigen Beispiel ist der Quotient immer gleich."]},
        {typ:"wf",f:"Eine geometrische Folge mit a₁ = 8 und q = 0,5 wird immer kleiner.",l:true,w:"Jedes Glied ist halb so gross wie das vorherige: 8, 4, 2, 1, …",h:["Was passiert, wenn du mit 0,5 multiplizierst?","Multiplizieren mit einer Zahl kleiner als 1 verkleinert."]},
        {typ:"mc",f:"Wie berechnest du q aus zwei benachbarten Gliedern einer geometrischen Folge?",opts:["q = aₙ₊₁ / aₙ","q = aₙ₊₁ − aₙ","q = aₙ₊₁ · aₙ"],l:0,w:"q ist der Quotient benachbarter Glieder. Die Differenz gehört zur arithmetischen Folge.",h:["Bei geometrischen Folgen wird multipliziert.","Die Umkehrung der Multiplikation ist die Division."]},
        {typ:"wf",f:"Die Folge 1, 3, 9, 27, … ist geometrisch mit q = 3.",l:true,w:"Jedes Glied ist das 3-Fache des vorherigen.",h:["Teile jedes Glied durch das vorherige.","Der Quotient ist immer gleich."]},
        {typ:"zahl",gen:()=>{const a=R(2,9),q=R(2,5),n=R(5,9),v=a*q**(n-1);return{f:`Ein Gerücht verbreitet sich: Am 1. Tag erfahren es ${a} Personen, am ${n}. Tag ${v}. Jeden Tag vervielfacht sich die Zahl mit demselben Faktor. Wie gross ist dieser Faktor?`,l:q,w:`q^(${n} − 1) = ${v}/${a} = ${v/a}, also q = ${q}`,h:["Gesucht ist q. Teile aₙ durch a₁.",`Ziehe die ${n-1}. Wurzel aus ${v/a}, oder probiere q = 2, 3, …`]}}},
        {typ:"zahl",gen:()=>{const a=R(1,5),q=R(2,3),m=2,p=R(4,5),k=R(7,9);return{f:`Der Schmied giesst Barren. Die ${m}. Charge wiegt ${a*q**(m-1)} kg, die ${p}. Charge ${a*q**(p-1)} kg, jede Charge ist gleich oft schwerer als die vorherige. Wie viel kg wiegt die ${k}. Charge?`,l:a*q**(k-1),w:`q^${p-m} = ${a*q**(p-1)}/${a*q**(m-1)} = ${q**(p-m)}, also q = ${q}; a₁ = ${a}; a${k} = ${a} · ${q}^${k-1} = ${a*q**(k-1)}`,h:["Bestimme zuerst q aus den zwei gegebenen Gliedern: q^(p − m) = aₚ / aₘ.","Berechne danach a₁ und dann das gesuchte Glied."]}}},
        {typ:"mc",f:"Welche Aussage stimmt für die Folge 100, 50, 25, 12,5, … ?",opts:["Geometrisch mit q = 0,5","Arithmetisch mit d = −50","Geometrisch mit q = 2"],l:0,w:"Jedes Glied ist halb so gross wie das vorherige: q = 0,5. Die Differenzen sind nicht konstant.",h:["Berechne Quotient und Differenz benachbarter Glieder.","Nur eines von beiden ist konstant."]},
        {typ:"wf",f:"Für q < 0 wechseln die Vorzeichen der Glieder einer geometrischen Folge ständig.",l:true,w:"Jede Multiplikation mit einer negativen Zahl dreht das Vorzeichen um.",h:["Was passiert mit dem Vorzeichen, wenn du mit einer negativen Zahl multiplizierst?","Probiere: 2, −4, 8, …"]}
      ]},
    {ort:"Wachturm",figur:"Försterin",emoji:"🌲",ziel:"Wegkarte",zu:"Ein Schlagbaum sperrt den Weg, und der Wachturm ist besetzt. Du brauchst zuerst eine Waffe aus der Schmiede.",text:"Die Försterin sagt: «Ohne Wegkarte kommst du hier nicht durch, {Name}. Dafür musst du rechnen: Wenn du die Glieder einer arithmetischen Folge zusammenzählst, erhältst du eine arithmetische Reihe. Der junge Gauss hat 1 + 2 + … + 100 blitzschnell gelöst: Er paarte das erste mit dem letzten Glied, das zweite mit dem zweitletzten und so weiter. Jedes Paar hat dieselbe Summe.»",formeln:["Sₙ = n/2 · (a₁ + aₙ)","Sₙ = n/2 · (2a₁ + (n − 1) · d)","aₙ = a₁ + (n − 1) · d"],links:[
        {t:"Wikipedia: Arithmetische Reihe",u:"https://de.wikipedia.org/wiki/Arithmetische_Reihe"}
      ],aufgaben:[
        {typ:"mc",f:"Welche Formel liefert die Summe der ersten n Glieder einer arithmetischen Folge?",opts:["Sₙ = n/2 · (a₁ + aₙ)","Sₙ = a₁ · (qⁿ − 1) / (q − 1)","Sₙ = a₁ + (n − 1) · d"],l:0,w:"Die Summe ist die halbe Anzahl der Glieder mal die Summe aus erstem und letztem Glied. Die zweite Formel gehört zur geometrischen Reihe, die dritte liefert nur ein einzelnes Glied.",h:["Denk an die Idee von Gauss: Paare aus erstem und letztem Glied.","Die richtige Formel enthält n/2 und a₁ + aₙ."]},
        {typ:"zahl",gen:()=>{const a=R(3,20),d=R(2,9),n=R(10,30),v=n*a+d*n*(n-1)/2;return{f:`Im Holzlager liegen die Stämme in Reihen übereinander: oben ${a}, jede Reihe darunter ${d} mehr, insgesamt ${n} Reihen. Wie viele Stämme sind es insgesamt?`,l:v,w:`Sₙ = ${n}/2 · (2·${a} + (${n} − 1)·${d}) = ${v}`,h:["Gesucht ist die Summe Sₙ der ersten n Glieder. Die Formel steht im Codex.",`Setze ein: a₁ = ${a}, d = ${d}, n = ${n}. Rechne zuerst die Klammer aus.`]}}},
        {typ:"zahl",gen:()=>{const a=R(2,12),n=R(10,28),v=n*a+n*(n-1);return{f:`Der Jäger legt Pfeile in Bündeln aus: Im 1. Bündel sind ${a} Pfeile, in jedem weiteren Bündel 2 mehr. Insgesamt hat er ${v} Pfeile ausgelegt. Wie viele Bündel sind es?`,l:n,w:`Sₙ = n/2 · (2·${a} + (n − 1)·2) = n² + ${a-1}·n = ${v}, also n² + ${a-1}n − ${v} = 0 und damit n = ${n}`,h:["Setze a₁, d = 2 und Sₙ in die Summenformel Sₙ = n/2 · (2a₁ + (n − 1)·d) ein und multipliziere aus.",`Du erhältst n² + ${a-1}n = ${v}. Löse die quadratische Gleichung (nur die positive Lösung zählt).`]}}},
        {typ:"wf",f:"Die Summe 1 + 2 + 3 + … + 10 beträgt 55.",l:true,w:"Sₙ = 10/2 · (1 + 10) = 5 · 11 = 55.",h:["Verwende die Formel mit erstem und letztem Glied.","n = 10, a₁ = 1, a₁₀ = 10."]},
        {typ:"mc",f:"Wie gross ist 1 + 2 + 3 + … + 100?",opts:["5050","5000","10100"],l:0,w:"S₁₀₀ = 100/2 · (1 + 100) = 50 · 101 = 5050.",h:["Verwende die Formel mit erstem und letztem Glied.","n = 100, a₁ = 1, a₁₀₀ = 100."]},
        {typ:"wf",f:"Bei einer arithmetischen Reihe mit d = 0 gilt Sₙ = n · a₁.",l:true,w:"Bei d = 0 sind alle Glieder gleich a₁. n Glieder ergeben n · a₁.",h:["Was bedeutet d = 0 für die Glieder?","Alle Glieder sind gleich."]},
        {typ:"zahl",gen:()=>{const a=R(3,25),d=R(2,9),n=R(10,30),v=n*a+d*n*(n-1)/2;return{f:`Im Wald stapelt die Försterin Stämme: Jede Reihe hat ${d} Stämme mehr als die darüberliegende. Es sind ${n} Reihen mit insgesamt ${v} Stämmen. Wie viele Stämme liegen in der obersten Reihe?`,l:a,w:`${v} = ${n}/2 · (2a₁ + ${n-1}·${d}), also a₁ = ${a}`,h:["Gesucht ist a₁. Setze alles andere in Sₙ = n/2 · (2a₁ + (n − 1)·d) ein.","Löse die Gleichung nach a₁ auf."]}}},
        {typ:"zahl",gen:()=>{const n=2*R(6,20),a=R(3,30),d=R(2,9),e=a+(n-1)*d,v=n/2*(a+e);return{f:`Der Imker zählt Waben: In der ersten Kiste sind ${a}, in der letzten ${e}, dazwischen nimmt die Zahl gleichmässig zu. Es sind ${n} Kisten. Wie viele Waben sind es insgesamt?`,l:v,w:`Sₙ = ${n}/2 · (${a} + ${e}) = ${v}`,h:["Hier sind erstes und letztes Glied bekannt. Welche Summenformel passt?","Sₙ = n/2 · (a₁ + aₙ)"]}}},
        {typ:"mc",f:"Wie viele Glieder hat die Reihe 3 + 7 + 11 + … + 43?",opts:["11","10","12"],l:0,w:"d = 4, also n = (43 − 3)/4 + 1 = 11.",h:["Bestimme d und forme aₙ = a₁ + (n − 1)·d nach n um.","n = (aₙ − a₁)/d + 1"]},
        {typ:"wf",f:"Die Summe der ersten n ungeraden Zahlen 1 + 3 + 5 + … ist n².",l:true,w:"Sₙ = n/2 · (1 + (2n − 1)) = n/2 · 2n = n².",h:["Das n-te ungerade Glied ist 2n − 1.","Setze in Sₙ = n/2 · (a₁ + aₙ) ein."]}
      ]},
    {ort:"Burg",figur:"Vagabund",emoji:"🧳",ziel:"Schild",zu:"Die Zugbrücke ist oben, das Tor verschlossen. Ohne Wegkarte findest du den Weg nicht.",text:"Ein Vagabund sitzt am Wegrand vor der Burg und grinst dich an: «Du willst in die Burg, {Name}? Dann musst du rechnen können! Bei einer geometrischen Reihe addierst du die Glieder einer geometrischen Folge: Jeder Tag bringt das q-Fache vom Vortag. Die Summe wächst schnell, aber es gibt eine Formel dafür.»",formeln:["Sₙ = a₁ · (qⁿ − 1) / (q − 1)   (q ≠ 1)","Sₙ = a₁ · (1 − qⁿ) / (1 − q)   (q ≠ 1)","aₙ = a₁ · qⁿ⁻¹"],links:[
