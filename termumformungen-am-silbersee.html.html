<style>
:root{--paper:#ecdcb4;--ink:#2b1d12;--wood:#6b4423;--brass:#c28b2c;--red:#8c2f1b;--ok:#2f6b32;--soft:#d8c391;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#3a2b1c;--ink:#f0e2c4;--wood:#a8744a;--brass:#e0a63e;--red:#e0765c;--ok:#7bc47f;--soft:#4b3924}}
:root[data-theme="dark"]{--paper:#3a2b1c;--ink:#f0e2c4;--wood:#a8744a;--brass:#e0a63e;--red:#e0765c;--ok:#7bc47f;--soft:#4b3924}

#app{position:relative;width:100%;height:100%}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

input.t{width:100%;box-sizing:border-box;font:1.4rem Georgia,serif;padding:8px;border:3px solid var(--wood);border-radius:8px;background:#fffaf0;color:#2b1d12}

small{opacity:.85}
@media (max-width:600px){.card{padding:12px}.q{font-size:1.4rem}}
</style></head>
<body><div id="app">
<canvas id="c"></canvas><div id="lbls"></div>
<div id="hud" hidden><span id="nm"></span><span id="mo"></span><span class="sp"></span><button class="b g" id="snb" onclick="G.snd()">🔇 Ton aus</button><button class="b g" id="fxb" onclick="G.fx()">✨ Effekte an</button><button class="b" onclick="G.bag()">🎒 Rucksack</button></div>
<div id="inv"></div><div id="pr" onclick="G.act()"></div><div id="ts"></div>
<div id="pad"><i></i><button data-k="arrowup">▲</button><i></i><button data-k="arrowleft">◀</button><i></i><button data-k="arrowright">▶</button><i></i><button data-k="arrowdown">▼</button><i></i></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ================= 1. MATHE-ENGINE (Parser, Polynome, Prüfung) ================= */
const mono=(c,e)=>({[kk(e)]:{c,e}});
const kk=e=>Object.keys(e).filter(v=>e[v]).sort().map(v=>v+e[v]).join('');
function add(A,B,s=1){const R={};for(const k in A)R[k]=A[k];for(const k in B){R[k]=R[k]?{c:R[k].c+s*B[k].c,e:R[k].e}:{c:s*B[k].c,e:B[k].e}}for(const k in R)if(Math.abs(R[k].c)<1e-9)delete R[k];return R}
function mul(A,B){let R={};for(const a in A)for(const b in B){const e={...A[a].e};for(const v in B[b].e)e[v]=(e[v]||0)+B[b].e[v];R=add(R,mono(A[a].c*B[b].c,e))}return R}
function toP(n){switch(n.t){case'n':return mono(n.v,{});case'v':return mono(1,{[n.v]:1});case'+':return add(toP(n.a),toP(n.b));case'-':return add(toP(n.a),toP(n.b),-1);case'neg':return mul(mono(-1,{}),toP(n.a));case'*':return mul(toP(n.a),toP(n.b));case'^':{let r=mono(1,{});const b=toP(n.a);for(let i=0;i<n.n;i++)r=mul(r,b);return r}}}
const eq=(A,B)=>!Object.keys(add(A,B,-1)).length;
function parse(s){
 s=s.replace(/\s+/g,'').replace(/[·×⋅]/g,'*').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/,/g,'.').toLowerCase();
 if(!s)throw'Das Feld ist leer.';
 const t=[];for(let i=0;i<s.length;){const c=s[i];
  if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;t.push({n:parseFloat(s.slice(i,j))});i=j}
  else if(/[a-z]/.test(c)){t.push({v:c});i++}
  else if('+-*^()'.includes(c)){t.push({o:c});i++}
  else throw'Das Zeichen „'+c+'“ kenne ich nicht.'}
 let p=0;const pk=()=>t[p];
 function expr(){let a=term();while(pk()&&(pk().o=='+'||pk().o=='-')){const o=t[p++].o;a={t:o,a,b:term()}}return a}
 function term(){let a=un();for(;;){const k=pk();if(!k)break;
  if(k.o=='*'){p++;a={t:'*',a,b:un()}}else if(k.n!==undefined||k.v||k.o=='('){a={t:'*',a,b:pw()}}else break}return a}
 function un(){const k=pk();if(k&&k.o=='-'){p++;return{t:'neg',a:un()}}if(k&&k.o=='+'){p++;return un()}return pw()}
 function pw(){let a=at();if(pk()&&pk().o=='^'){p++;const k=t[p++];if(!k||k.n===undefined||k.n%1||k.n>6)throw'Nach ^ muss eine kleine ganze Zahl stehen.';a={t:'^',a,n:k.n}}return a}
 function at(){const k=t[p++];if(!k)throw'Der Term ist unvollständig.';
  if(k.n!==undefined)return{t:'n',v:k.n};if(k.v)return{t:'v',v:k.v};
  if(k.o=='('){const e=expr();if(!pk()||pk().o!=')')throw'Eine Klammer wurde nicht geschlossen.';p++;return e}
  throw'Hier stimmt etwas nicht mit dem Zeichen „'+k.o+'“.'}
 const r=expr();if(p<t.length)throw'Der Term ist nicht ganz lesbar (Klammern prüfen).';return r}
function flat(n,o){if(n.t=='+'){flat(n.a,o);flat(n.b,o)}else if(n.t=='-'){flat(n.a,o);o.push({t:'neg',a:n.b})}else o.push(n)}
const hasSum=n=>n.t=='+'||n.t=='-'||(n.a?hasSum(n.a):false)||(n.b?hasSum(n.b):false);
function expd(ast){const o=[],seen={};flat(ast,o);
 for(const x of o){if(hasSum(x))return'Es stehen noch Klammern im Term. Löse sie ganz auf.';
  const k=Object.keys(toP(x))[0];if(k===undefined)continue;
  if(seen[k])return'Richtig gerechnet, aber noch nicht fertig: Fasse gleichartige Terme zusammen.';seen[k]=1}return null}
const deg=q=>Math.max(0,...Object.values(q).map(m=>Object.values(m.e).reduce((a,b)=>a+b,0)));
function fact(n,dp){if(n.t=='+'||n.t=='-')return'Das ist noch eine Summe. Schreibe den Term als Produkt mit einer Klammer.';
 const f=[];(function w(x){if(x.t=='*'){w(x.a);w(x.b)}else if(x.t=='neg')w(x.a);else if(x.t=='^')f.push(x.a);else f.push(x)})(n);
 const s=f.filter(x=>x.t=='+'||x.t=='-');if(!s.length)return'Es fehlt eine Klammer mit einer Summe.';
 for(const x of s){if(dp&&deg(toP(x))>1)return'Richtig, aber die Klammer lässt sich noch weiter zerlegen. Steckt eine binomische Formel darin?';const m=Object.values(toP(x)),c=m.map(q=>q.c);
  if(c.some(v=>v%1))return'Mit Kommazahlen in der Klammer geht es noch weiter: Klammere so aus, dass nur ganze Zahlen bleiben.';
  const g=c.reduce((a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a});
  if(g>1||Object.keys(m[0].e).some(v=>m.every(q=>q.e[v])))return'Richtig, aber es geht noch weiter: In der Klammer steckt noch ein gemeinsamer Faktor.'}return null}
const fk=o=>mk({kind:'factor',ins:'Klammere so weit wie möglich aus (Ergebnis als Produkt).',...o});
function check(T,inp){let ast;try{ast=parse(inp)}catch(e){return{ok:0,m:String(e),t:null}}
 const p=toP(ast);
 if(eq(p,T.target)){const r=T.kind=='expand'?expd(ast):T.kind=='factor'?fact(ast,T.deep):null;return r?{ok:0,m:r,t:'unf'}:{ok:1}}
 for(const[s,m,t]of T.traps){try{if(eq(p,toP(parse(s))))return{ok:0,m,t}}catch(e){}}
 if(eq(p,mul(mono(-1,{}),T.target)))return{ok:0,m:'Fast! Alle Vorzeichen sind vertauscht.',t:'vorz'};
 if(deg(p)!=deg(T.target))return{ok:0,m:'Prüfe die Potenzen: x·x ergibt x², nicht 2x oder x.',t:'pot'};
 return{ok:0,m:T.kind=='factor'?'Noch nicht richtig. Probe: Multipliziere deine Klammer wieder aus. Kommt der Ausgangsterm heraus?':'Noch nicht richtig. Rechne Teilprodukt für Teilprodukt und prüfe die Zahlen.',t:'rech'}}

/* ================= 2. AUFGABEN-GENERATOREN ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const co=(c,v)=>c==1?v:c==-1?'−'+v:c+v, sg=(c,v)=>(c<0?'−':'+')+(Math.abs(c)==1&&v?v:Math.abs(c)+v), bin=(a,v,b)=>co(a,v)+sg(b,'');
const ERRL={vorz:'Vorzeichenfehler',teil:'Teilprodukt vergessen',pot:'Potenzfehler',unf:'Nicht zusammengefasst',rech:'Rechenfehler'};
const INS1='Multipliziere aus und fasse zusammen, sodass keine Klammern mehr übrig sind.';
const mk=o=>({kind:'expand',ins:INS1,vars:['x'],...o,target:toP(parse(o.ans))});
const GEN={ // id:{t:Titel, r:Lohn, f:Generator}
1:{t:'Erzsäcke wiegen',r:5,f(){const k=R(2,6),a=R(2,5),b=R(2,9),v=pick(['x','y','a']);return mk({vars:[v],story:`Goldwäscher Silas hat ${k} Säcke Erz. Jeder Sack wiegt (${bin(a,v,b)}) kg. Wie schwer ist die ganze Ladung?`,q:`${k}·(${bin(a,v,b)})`,ans:`${k*a}${v}+${k*b}`,traps:[[`${k*a}${v}+${b}`,'Die Zahl vor der Klammer gilt für jeden Summanden, nicht nur für den ersten.','teil']],hints:[`Multipliziere ${k} mit jedem Summanden in der Klammer.`,`Rechne ${k}·${a}${v} und ${k}·${b}.`]})}},
2:{t:'Sand sieben',r:6,f(){const k=R(2,6),a=R(2,5),b=R(2,8),v=pick(['x','y']);return mk({vars:[v],story:`Du siebst ${k} Eimer Sand. In jedem steckt (${co(a,v)}−${b}) Gramm Gold, nachdem die Steine abgezogen sind.`,q:`${k}·(${co(a,v)}−${b})`,ans:`${k*a}${v}-${k*b}`,traps:[[`${k*a}${v}-${b}`,'Auch der zweite Summand wird mit '+k+' multipliziert.','teil'],[`${k*a}${v}+${k*b}`,'Plus mal Minus: k·(−b) ergibt −k·b. Das Minuszeichen bleibt.','vorz']],hints:[`Das Minus gehört zur ${b}. Rechne ${k}·(−${b}).`,`Ergebnis: ${k*a}${v} und dann minus ${k}·${b}.`]})}},
3:{t:'Vorräte abrechnen',r:7,f(){const m=R(5,9),k=R(2,m-2),b=R(2,6),v=pick(['x','y','a']);return mk({vars:[v],story:`Von ${m}${v} Pfund Mehl gibst du ${k} Portionen zu je (${v}+${b}) Pfund ab. Was bleibt?`,q:`${m}${v}−${k}·(${v}+${b})`,ans:`${m-k}${v}-${k*b}`,traps:[[`${m-k}${v}+${k*b}`,'Minus vor der Klammer: Alle Vorzeichen in der Klammer drehen sich um.','vorz'],[`${m}${v}-${k}${v}-${b}`,'Die '+k+' muss auch mit '+b+' multipliziert werden.','teil']],hints:['Löse zuerst die Klammer auf: Das Minus davor wirkt auf jeden Summanden.',`${k}·(${v}+${b}) = ${k}${v}+${k*b}, davon wird alles abgezogen.`]})}},
4:{t:'Goldwaschrinne bauen',r:7,f(){const a=R(2,4),b=R(2,5),c=R(2,7),v=pick(['x','y','a']);return mk({vars:[v],story:`Deine Rinne ist ${a}${v} Fuss lang und (${bin(b,v,c)}) Fuss breit. Wie gross ist die Fläche?`,q:`${a}${v}·(${bin(b,v,c)})`,ans:`${a*b}${v}^2+${a*c}${v}`,traps:[[`${a*b}${v}+${a*c}${v}`,`${v}·${v} ergibt ${v}², nicht ${v}.`,'pot'],[`${a*b}${v}^2+${c}${v}`,`Auch ${c} wird mit ${a}${v} multipliziert.`,'teil'],[`${a*b}${v}^2+${a*c}`,`Das ${v} von ${a}${v} bleibt im zweiten Summanden erhalten.`,'teil']],hints:[`Multipliziere ${a}${v} mit jedem Summanden.`,`${a}${v}·${co(b,v)} = ${a*b}${v}² und ${a}${v}·${c} = ${a*c}${v}.`]})}},
5:{t:'Land vermessen',r:8,f(){const a=R(1,8),b=R(1,8),v=pick(['x','y','a']);return mk({vars:[v],story:`Ein Grundstück misst (${v}+${a}) mal (${v}+${b}) Schritte. Schreibe die Fläche ohne Klammern.`,q:`(${v}+${a})·(${v}+${b})`,ans:`${v}^2+${a+b}${v}+${a*b}`,traps:[[`${v}^2+${a*b}`,'Beim Ausmultiplizieren gibt es vier Teilprodukte. Dir fehlen die gemischten.','teil'],[`${v}^2+${a+b}`,`Die gemischten Produkte ergeben ${v}-Terme: ${a}${v}+${b}${v} = ${a+b}${v}.`,'teil'],[`2${v}+${a+b}`,`${v}·${v} ergibt ${v}², nicht 2${v}.`,'pot']],hints:['Jeder Summand der ersten Klammer wird mit jedem der zweiten multipliziert: vier Produkte.',`${v}·${v}, ${v}·${b}, ${a}·${v}, ${a}·${b}. Dann zusammenfassen.`]})}},
6:{t:'Schürfrechte teilen',r:9,f(){const a=R(2,8);let b=R(2,8);if(b==a)b++;const v=pick(['x','y','a']);return mk({vars:[v],story:`Dein Claim ist (${v}−${a}) mal (${v}+${b}) Schritte gross. Rechne die Fläche aus.`,q:`(${v}−${a})·(${v}+${b})`,ans:`${v}^2+${b-a}${v}-${a*b}`,traps:[[`${v}^2+${b-a}${v}+${a*b}`,'(−'+a+')·'+b+' ist negativ: Minus mal Plus ergibt Minus.','vorz'],[`${v}^2+${a+b}${v}-${a*b}`,`Die gemischten Terme: ${b}${v} und −${a}${v}. Das ergibt (${b}−${a})${v}.`,'vorz'],[`${v}^2-${a*b}`,'Die gemischten Teilprodukte fehlen.','teil']],hints:['Das Minus gehört zur '+a+'. Nimm es bei jedem Produkt mit.',`Vier Produkte: ${v}², ${b}${v}, −${a}${v}, −${a*b}.`]})}},
7:{t:'Claim im Gebirge',r:11,f(){const a=R(2,3),c=R(2,4),b=R(1,5),d=R(1,5),v=pick(['x','y']);return mk({vars:[v],story:`Der Claim ist (${bin(a,v,b)}) mal (${bin(c,v,d)}) Schritte gross. Fläche ohne Klammern?`,q:`(${bin(a,v,b)})·(${bin(c,v,d)})`,ans:`${a*c}${v}^2+${a*d+b*c}${v}+${b*d}`,traps:[[`${a*c}${v}^2+${b*d}`,'Die gemischten Teilprodukte fehlen.','teil'],[`${a*c}${v}^2+${b*c}${v}+${b*d}`,`Ein gemischtes Produkt fehlt: ${a}${v}·${d}.`,'teil'],[`${a*c}${v}^2+${a*d}${v}+${b*d}`,`Ein gemischtes Produkt fehlt: ${b}·${c}${v}.`,'teil']],hints:['Vier Teilprodukte, danach die beiden mit '+v+' zusammenfassen.',`${a}${v}·${c}${v}, ${a}${v}·${d}, ${b}·${c}${v}, ${b}·${d}.`]})}},
8:{t:'Claimbuch führen',r:9,f(){const[p,q]=pick([['a','b'],['x','y']]),m=R(2,6),n=R(2,6);return mk({vars:[p,q],story:`Im Claimbuch steht die Fläche als (${p}+${m}) mal (${q}+${n}). Schreibe sie ohne Klammern.`,q:`(${p}+${m})·(${q}+${n})`,ans:`${p}${q}+${n}${p}+${m}${q}+${m*n}`,traps:[[`${p}${q}+${m*n}`,'Die gemischten Teilprodukte fehlen.','teil'],[`${p}${q}+${n}${p}+${m*n}`,'Ein Teilprodukt fehlt. Es sind insgesamt vier.','teil']],hints:['Jeder Summand mit jedem multiplizieren. Verschiedene Variablen lassen sich nicht zusammenfassen.',`${p}·${q}, ${p}·${n}, ${m}·${q}, ${m}·${n}.`]})}},
9:{t:'Lohn abrechnen',r:10,f(){const k=R(2,5),m=R(2,5),a=R(1,6),b=R(1,6),v=pick(['x','y','a']);return mk({vars:[v],story:`Zwei Trupps: ${k}·(${v}+${a}) Dollar und ${m}·(${v}+${b}) Dollar. Wie viel ist es zusammen?`,q:`${k}·(${v}+${a})+${m}·(${v}+${b})`,ans:`${k+m}${v}+${k*a+m*b}`,traps:[[`${k+m}${v}+${a+b}`,'Jede Klammer zuerst mit dem eigenen Faktor ausmultiplizieren.','teil'],[`${k+m}${v}+${k*a}+${b}`,`Auch ${b} wird mit ${m} multipliziert.`,'teil']],hints:['Erst beide Klammern einzeln ausmultiplizieren, dann zusammenfassen.',`${k}${v}+${k*a}+${m}${v}+${m*b}. Jetzt gleichartige Terme addieren.`]})}}
,11:{t:'Kassenbuch führen',r:9,f(){const g=R(2,6),a=R(1,4),b=pick([1,5,7]),v=pick(['x','y','a']);return fk({vars:[v],story:`Der Bankier verbucht Einlagen von ${co(g*a,v)}${sg(g*b,'')} Dollar. Schreibe den Term als Produkt, damit der gemeinsame Faktor sichtbar wird.`,q:`${co(g*a,v)}${sg(g*b,'')}`,ans:`${g}(${co(a,v)}+${b})`,traps:[[`${g}(${co(a,v)}+${g*b})`,'Beim Ausklammern wird jeder Summand durch den Faktor geteilt, auch der zweite.','teil']],hints:[`Welche grösste Zahl steckt in ${g*a} und in ${g*b}?`,`Gemeinsamer Faktor: ${g}. Teile beide Summanden durch ${g}.`]})}},
12:{t:'Weidefläche',r:10,f(){const g=R(2,5),a=R(1,4),b=pick([1,5,7]),v=pick(['x','y','a']);return fk({vars:[v],story:`Zwei Weiden haben zusammen die Fläche ${g*a}${v}²+${g*b}${v}. Klammere so weit wie möglich aus.`,q:`${g*a}${v}²+${g*b}${v}`,ans:`${g}${v}(${co(a,v)}+${b})`,traps:[[`${g}${v}(${co(a,v)}+${g*b})`,'Teile jeden Summanden durch den ganzen Faktor, auch den zweiten.','teil']],hints:['In beiden Summanden steckt eine Zahl und eine Variable.',`Gemeinsamer Faktor: ${g}${v}. Wie oft passt er in ${g*a}${v}² und in ${g*b}${v}?`]})}},
13:{t:'Frachtlohn',r:9,f(){const g=R(2,6),a=R(1,3),b=pick([1,5,7]),v=pick(['x','y','a']);return fk({vars:[v],story:`Die Fracht kostet ${co(g*a,v)}−${g*b} Dollar. Mache den gemeinsamen Faktor sichtbar.`,q:`${co(g*a,v)}−${g*b}`,ans:`${g}(${co(a,v)}-${b})`,traps:[[`${g}(${co(a,v)}+${b})`,'Das Minuszeichen bleibt beim Ausklammern erhalten.','vorz']],hints:[`Welche grösste Zahl steckt in ${g*a} und ${g*b}?`,`Gemeinsamer Faktor: ${g}. Das Minus bleibt in der Klammer.`]})}},
14:{t:'Quadratischer Claim',r:11,f(){const a=R(2,9),v=pick(['x','y','a']);return mk({vars:[v],story:`Ein quadratischer Claim hat die Seitenlänge (${v}+${a}). Schreibe die Fläche ohne Klammern.`,q:`(${v}+${a})²`,ans:`${v}^2+${2*a}${v}+${a*a}`,traps:[[`${v}^2+${a*a}`,'Der Mittelterm fehlt: (a+b)² ist nicht a²+b².','teil'],[`${v}^2+${a}${v}+${a*a}`,'Der Mittelterm ist 2·a·b, also doppelt so gross.','teil']],hints:['Binomische Formel: (a+b)² = a²+2ab+b².',`Hier ist a=${v} und b=${a}: ${v}², 2·${v}·${a}, ${a}².`]})}},
15:{t:'Neue Grenzlinie',r:12,f(){const a=R(2,9),v=pick(['x','y','a']);return mk({vars:[v],story:`Der Zaun wird um ${a} Schritt gekürzt. Der Claim hat nun die Seitenlänge (${v}−${a}). Fläche ohne Klammern?`,q:`(${v}−${a})²`,ans:`${v}^2-${2*a}${v}+${a*a}`,traps:[[`${v}^2-${a*a}`,'Der Mittelterm fehlt, und (−a)² ist positiv.','teil'],[`${v}^2+${2*a}${v}+${a*a}`,'Beim Minus bleibt der Mittelterm negativ: −2ab.','vorz'],[`${v}^2-${2*a}${v}-${a*a}`,'Ein Quadrat ist nie negativ: (−a)² = +a².','vorz']],hints:['Binomische Formel: (a−b)² = a²−2ab+b².',`a=${v}, b=${a}. Das letzte Glied ist ${a}², also positiv.`]})}},
16:{t:'Schürfplatz tauschen',r:11,f(){const a=R(2,9),v=pick(['x','y','a']);return mk({vars:[v],story:`Du tauschst mit einem Nachbarn: Dein Claim wird in einer Richtung ${a} länger, in der anderen ${a} kürzer: (${v}+${a})·(${v}−${a}). Fläche?`,q:`(${v}+${a})·(${v}−${a})`,ans:`${v}^2-${a*a}`,traps:[[`${v}^2+${a*a}`,'Bei (a+b)(a−b) heben sich die gemischten Terme auf. Übrig bleibt −b².','vorz'],[`${v}^2-${a}`,'Auch die Zahl wird quadriert.','pot']],hints:['Dritte binomische Formel: (a+b)(a−b) = a²−b².',`Die gemischten Terme ${a}${v} und −${a}${v} heben sich auf.`]})}},
17:{t:'Grosser Claim',r:14,f(){const a=R(2,4),b=R(1,5),v=pick(['x','y']);return mk({vars:[v],story:`Ein Claim ist quadratisch mit der Seitenlänge (${bin(a,v,b)}). Schreibe die Fläche ohne Klammern.`,q:`(${bin(a,v,b)})²`,ans:`${a*a}${v}^2+${2*a*b}${v}+${b*b}`,traps:[[`${a}${v}^2+${2*a*b}${v}+${b*b}`,`Auch ${a} wird quadriert: (${a}${v})² = ${a*a}${v}².`,'pot'],[`${a*a}${v}^2+${b*b}`,'Der Mittelterm 2·a·b fehlt.','teil']],hints:['(a+b)² = a²+2ab+b². Hier ist a = '+co(a,v)+` und b = ${b}.`,`a² = ${a*a}${v}², 2ab = ${2*a*b}${v}, b² = ${b*b}.`]})}},
18:{t:'Quadrat erkennen',r:12,f(){const a=R(2,9),v=pick(['x','y','a']);return fk({vars:[v],ins:'Schreibe als Quadrat einer Klammer (binomische Formel rückwärts).',story:`Ein Landstück hat die Fläche ${v}²+${2*a}${v}+${a*a}. Es ist quadratisch. Wie lang ist die Seite?`,q:`${v}²+${2*a}${v}+${a*a}`,ans:`(${v}+${a})^2`,traps:[],hints:['Erstes und letztes Glied sind Quadrate. Passt der Mittelterm zu 2·a·b?',`√${a*a} = ${a}, und 2·${v}·${a} = ${2*a}${v}. Also (${v}+${a})².`]})}},
19:{t:'Differenz der Quadrate',r:12,f(){const a=R(2,9),v=pick(['x','y','a']);return fk({vars:[v],ins:'Schreibe als Produkt zweier Klammern.',story:`Von einem Quadrat der Fläche ${v}² wird ein kleines Quadrat mit ${a*a} abgezogen. Schreibe ${v}²−${a*a} als Produkt.`,q:`${v}²−${a*a}`,ans:`(${v}+${a})(${v}-${a})`,traps:[],hints:['Dritte binomische Formel rückwärts: a²−b² = (a+b)(a−b).',`√${a*a} = ${a}. Also (${v}+${a})(${v}−${a}).`]})}}
,21:{t:'Klammeransatz',r:3,f(){let m,n;do{m=R(-9,9);n=R(-9,9)}while(!m||!n);const v=pick(['x','y','a']),p=m+n,q=m*n,qs=`${v}²${p?sg(p,v):''}${sg(q,'')}`;return mk({kind:'blank',vars:[v],blanks:[m,n],ins:'Finde zwei Zahlen: Ihr Produkt ist das letzte Glied, ihre Summe die Zahl vor '+v+'.',story:`Die Gesteinsschicht hat die Form ${qs}. Schreibe sie als Produkt (${v}+__)(${v}+__).`,q:qs,ans:`(${v}${sg(m,'')})(${v}${sg(n,'')})`,traps:[],hints:[`Gesucht: zwei Zahlen mit Produkt ${q} und Summe ${p}.`,`Probiere die Faktorpaare von ${q}: Welches hat die Summe ${p}? Achte auf die Vorzeichen.`]})}},
22:{t:'Teilsummen',r:3,f(){const[p,q,u,w]=pick([['a','b','x','y'],['x','y','a','b'],['a','b','m','n']]),s=pick(['+','-']);return fk({vars:[p,q,u,w],ins:'Klammere in Teilsummen aus und schreibe das Ergebnis als Produkt zweier Klammern.',story:`Die Schicht lässt sich nur knacken, wenn du den Term als Produkt schreibst.`,q:`${p}${u}${s}${p}${w}+${q}${u}${s}${q}${w}`.replace(/-/g,'−'),ans:`(${p}+${q})(${u}${s}${w})`,traps:[],hints:[`Klammere aus den ersten zwei Termen ${p} aus, aus den letzten zwei ${q}.`,`${p}(${u}${s}${w})+${q}(${u}${s}${w}). Jetzt ist (${u}${s}${w}) der gemeinsame Faktor.`]})}},
23:{t:'Teilsummen mit Zahlen',r:3,f(){const k=R(2,5),[m,n]=pick([[1,2],[2,3],[3,2],[1,3],[3,4],[4,3]]);return fk({vars:['a','x','y'],ins:'Klammere in Teilsummen aus und schreibe das Ergebnis als Produkt zweier Klammern.',story:'Eine Ader verläuft in zwei Richtungen. Fasse die vier Teile zu einem Produkt zusammen.',q:`${k*m}x+${k*n}y+${m>1?m:''}ax+${n>1?n:''}ay`,ans:`(${k}+a)(${m}x+${n}y)`,traps:[],hints:[`Klammere aus den ersten beiden Termen ${k} aus, aus den letzten beiden a.`,`${k}(${m}x+${n}y)+a(${m}x+${n}y). Dann den gemeinsamen Faktor (${m}x+${n}y) ausklammern.`]})}},
24:{t:'Quadrat im Fels',r:3,f(){const g=R(2,4),a=R(1,5),v=pick(['x','y','a']);return fk({vars:[v],deep:1,ins:'Klammere erst den gemeinsamen Faktor aus und prüfe dann die Klammer auf eine binomische Formel.',story:'Ein Felsblock hat die Form eines Terms, der sich in zwei Schritten zerlegen lässt.',q:`${g}${v}²+${2*g*a}${v}+${g*a*a}`,ans:`${g}(${v}+${a})^2`,traps:[],hints:['Klammere zuerst den gemeinsamen Zahlenfaktor aus.',`${g}(${v}²+${2*a}${v}+${a*a}): Erkennst du die binomische Formel?`]})}},
25:{t:'Geteilte Ader',r:3,f(){const g=R(2,5),a=R(2,6),v=pick(['x','y','a']);return fk({vars:[v],deep:1,ins:'Klammere erst den gemeinsamen Faktor aus und prüfe dann die Klammer auf eine binomische Formel.',story:'Zwei Silberadern kreuzen sich. Zerlege den Term vollständig.',q:`${g}${v}²−${g*a*a}`,ans:`${g}(${v}+${a})(${v}-${a})`,traps:[],hints:['Klammere zuerst den gemeinsamen Zahlenfaktor aus.',`${g}(${v}²−${a*a}): Die dritte binomische Formel hilft weiter.`]})}},
26:{t:'Ungleiche Claims',r:3,f(){const a=R(2,6),b=R(2,6),v=pick(['x','y','a']);return mk({vars:[v],story:'Zwei Schürfrechte werden gegeneinander verrechnet. Fasse alles zu einem möglichst kurzen Term zusammen.',q:`(${v}+${a})²−(${v}−${b})(${v}+${b})`,ans:`${2*a}${v}+${a*a+b*b}`,traps:[[`${2*a}${v}+${a*a-b*b}`,'Das Minus vor der zweiten Klammer dreht alle Vorzeichen um: −(x²−b²) = −x²+b².','vorz'],[`${a*a+b*b}`,'Der Mittelterm 2ab der ersten binomischen Formel fehlt.','teil']],hints:['Löse beide Klammern einzeln auf. Das Minus vor der zweiten Klammer wirkt auf alle Summanden.',`(${v}+${a})² = ${v}²+${2*a}${v}+${a*a} und (${v}−${b})(${v}+${b}) = ${v}²−${b*b}.`]})}},
27:{t:'Zwei Variablen quadrieren',r:3,f(){const[p,q]=pick([['a','b'],['x','y'],['m','n']]),c=R(2,4),d=R(2,5);return mk({vars:[p,q],story:'Das Claim-Quadrat hat zwei verschiedene Seitenmasse. Schreibe die Fläche ohne Klammern.',q:`(${c}${p}+${d}${q})²`,ans:`${c*c}${p}^2+${2*c*d}${p}${q}+${d*d}${q}^2`,traps:[[`${c*c}${p}^2+${d*d}${q}^2`,'Der Mittelterm 2·a·b fehlt: (a+b)² ist nicht a²+b².','teil'],[`${c}${p}^2+${2*c*d}${p}${q}+${d}${q}^2`,`Auch die Zahlen werden quadriert: (${c}${p})² = ${c*c}${p}².`,'pot']],hints:['(a+b)² = a²+2ab+b². Hier ist a = '+c+p+' und b = '+d+q+'.',`a² = ${c*c}${p}², 2ab = ${2*c*d}${p}${q}, b² = ${d*d}${q}².`]})}},
28:{t:'Doppelt ausklammern',r:3,f(){const[p,q]=pick([['a','b'],['x','y'],['m','n']]),[c,d]=pick([[1,2],[2,3],[3,2],[1,3]]),g=R(2,4);return fk({vars:[p,q],story:'In beiden Summanden stecken eine Zahl und mehrere Variablen. Klammere alles Gemeinsame aus.',q:`${g*c}${p}²${q}+${g*d}${p}${q}²`,ans:`${g}${p}${q}(${co(c,p)}+${co(d,q)})`,traps:[],hints:[`Gemeinsam sind die Zahl ${g} und die Variablen ${p} und ${q}.`,`Klammere ${g}${p}${q} aus. Was bleibt von jedem Summanden übrig?`]})}},
29:{t:'Tiefe Ader',r:3,f(){const a=R(2,6);let b=R(2,6);if(b==a)b++;const v=pick(['x','y','a']);return fk({vars:[v],story:'Die tiefste Schicht verlangt zwei Schritte: erst eine binomische Formel erkennen, dann die dritte anwenden.',q:`${v}²${sg(2*a,v)}${sg(a*a-b*b,'')}`,ans:`(${v}${sg(a+b,'')})(${v}${sg(a-b,'')})`,traps:[],hints:[`Schreibe ${v}²+${2*a}${v}+${a*a} als (${v}+${a})². Dann bleibt −${b*b} übrig.`,`(${v}+${a})²−${b*b}: Die dritte binomische Formel mit ${b}² liefert das Produkt.`]})}}

G.menu=()=>{const o=load();P(`<h2>Der Silbersee</h2><p>Dustville, 1881. Im Gebirge soll ein See liegen, an dessen Ufer Silber glänzt. Du hast nur eins: Mut zum Rechnen.</p><p><b>Wie heisst du, Fremder?</b></p><input class="t" id="nmi" maxlength="16" placeholder="Dein Name" onkeydown="if(event.key=='Enter')G.new()"><p><button class="b" onclick="G.new()">Abenteuer starten</button>${o&&o.name?`<button class="b g" onclick="G.cont()">Weiter als ${o.name.replace(/[<>&"]/g,'')} ($${o.money})</button>`:''}</p><small>Steuerung: WASD oder Pfeiltasten zum Laufen, E zum Reden und Handeln. Dein Fortschritt wird automatisch im Browser gespeichert.</small>`)};

G.bag=()=>{if(!S)return;const e=Object.entries(S.err).map(([k,v])=>`<li>${ERRL[k]}: ${v}×</li>`).join('')||'<li>Noch keine Fehler. Stark!</li>';
 P(`<h2>🎒 Rucksack</h2><p><b>Dollar:</b> $${S.money}</p><p><b>Ausrüstung:</b> ${S.inv.length?S.inv.map(i=>{const t=ITEMS.find(x=>x.id==i);return t.e+' '+t.n}).join(', '):'noch nichts'}</p><p><b>Auswertung</b> (für die Lehrperson)<br>Gelöste Aufträge: ${S.solved}, gekaufte Tipps: ${S.tips}</p><ul>${e}</ul><button class="b" onclick="G.x()">Schliessen</button><button class="b g" onclick="if(confirm('Wirklich neu beginnen? Der Fortschritt geht verloren.')){G.menu()}">Neues Spiel</button>`)};

G.ins=t=>{const i=$('in'),s=i.selectionStart,e=i.selectionEnd;if(t=='⌫'){const a=s==e?Math.max(0,s-1):s;i.value=i.value.slice(0,a)+i.value.slice(e);i.setSelectionRange(a,a)}else{i.value=i.value.slice(0,s)+t+i.value.slice(e);i.setSelectionRange(s+t.length,s+t.length)}i.focus()};
