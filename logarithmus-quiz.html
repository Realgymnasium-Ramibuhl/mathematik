];
const shuffle = a => [...a].sort(() => Math.random() - .5);

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  const r = cv.getBoundingClientRect();
  W = cv.width  = Math.round(r.width)  || 400;
  H = cv.height = Math.round(r.height) || 500;
}
window.addEventListener('resize', () => { resize(); if (!driving) draw(); });

const FORK     = 0.46;
const LW       = 46;
const MARGIN   = 0;
const PAD_B    = 28;
const PAD_T    = 50;
const LABEL_WY = 0.85;
const SPREAD   = 0.34;
const BOT_OFF  = [-LW, 0, LW];

function sy(wy) { return H - PAD_B - wy * (H - PAD_B - PAD_T); }
function laneX(lane, wy) {
  if (wy <= FORK) return W/2 + BOT_OFF[lane];
  const t = (wy - FORK) / (1 - FORK);
  const s = t * t * (3 - 2 * t);
  return W/2 + BOT_OFF[lane] + (SPREAD * W * [-1,0,1][lane] - BOT_OFF[lane]) * s;
}

let qs, qi, score;
let carLane, carVisX, carAngle, carWY, prog;
let driving, startTs, raf;
const DUR = 10000;

function init() {
  qs = shuffle(QS); qi = 0; score = 0;
  document.getElementById('sc').textContent = '0';
  beginRound();
}
function beginRound() {
  carLane = 1; carWY = 0; prog = 0; carAngle = 0;
  driving = true; startTs = null;
  resize();
  carVisX = laneX(1, 0);
  document.getElementById('qbox').textContent = qs[qi].q;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function loop(ts) {
  if (!startTs) startTs = ts;
  const elapsed = ts - startTs;
  const forkTime = FORK * DUR;
  prog  = elapsed <= forkTime
    ? Math.min(elapsed / DUR, FORK)
    : Math.min(FORK + (elapsed - forkTime) / (DUR / 3), 1);
  carWY   = prog;
  carVisX = laneX(carLane, carWY);

  const d = 0.012;
  const prevX = laneX(carLane, Math.max(0, carWY - d));
  const nextX = laneX(carLane, Math.min(1, carWY + d));
  const dy = sy(Math.max(0, carWY - d)) - sy(Math.min(1, carWY + d));
  const targetAngle = Math.atan2(nextX - prevX, dy);
  carAngle += (targetAngle - carAngle) * 0.10;

  draw();
  if (prog < 1) { raf = requestAnimationFrame(loop); }
  else { driving = false; setTimeout(showResult, 380); }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(0, 0, W, H);
  drawRoad();
  drawAnswers();
  drawCar();
}

function drawRoad() {
  const STEPS   = 150;
  const forkIdx = Math.round(FORK * STEPS);

  const EL = [0,1,2].map(l => {
    const pts = [];
    for (let i = 0; i <= STEPS; i++) { const wy = i/STEPS; pts.push([laneX(l,wy)-LW/2, sy(wy)]); }
    return pts;
  });
  const ER = [0,1,2].map(l => {
    const pts = [];
    for (let i = 0; i <= STEPS; i++) { const wy = i/STEPS; pts.push([laneX(l,wy)+LW/2, sy(wy)]); }
    return pts;
  });

  ctx.fillStyle = '#5a5a5a';
  for (let l = 0; l < 3; l++) {
    ctx.beginPath();
    EL[l].forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
    for (let i = STEPS; i >= 0; i--) ctx.lineTo(ER[l][i][0], ER[l][i][1]);
    ctx.closePath(); ctx.fill();
  }
  // fill sub-pixel seams between lanes below fork
  for (let g = 0; g < 2; g++) {
    ctx.beginPath();
    for (let i = 0; i <= forkIdx; i++) ctx.lineTo(ER[g][i][0], ER[g][i][1]);
    for (let i = forkIdx; i >= 0; i--) ctx.lineTo(EL[g+1][i][0], EL[g+1][i][1]);
    ctx.closePath(); ctx.fill();
  }

  // White outer edges
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); EL[0].forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();
  ctx.beginPath(); ER[2].forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();
  // Diverging inner edges above fork
  const af = arr => arr.slice(forkIdx);
  ctx.beginPath(); af(ER[0]).forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();
  ctx.beginPath(); af(EL[1]).forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();
  ctx.beginPath(); af(ER[1]).forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();
  ctx.beginPath(); af(EL[2]).forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();

  // Dashed centre lines (merged section only)
  ctx.setLineDash([18,14]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,220,.55)';
  const d1x = ER[0][0][0], d2x = ER[1][0][0];
  ctx.beginPath(); ctx.moveTo(d1x, sy(0)); ctx.lineTo(d1x, sy(FORK)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(d2x, sy(0)); ctx.lineTo(d2x, sy(FORK)); ctx.stroke();
  ctx.setLineDash([]);

  // Checkerboard finish
  for (let l = 0; l < 3; l++) {
    const wx = laneX(l, 0.98), sy98 = sy(0.98);
    const cols = 6, tw = LW/cols, th = 7;
    for (let r = 0; r < 2; r++) for (let c = 0; c < cols; c++) {
      ctx.fillStyle = (r+c)%2===0 ? '#fff' : '#000';
      ctx.fillRect(wx - LW/2 + c*tw, sy98 + r*th, tw, th);
    }
  }
}

function drawAnswers() {
  const q = qs[qi];
  for (let l = 0; l < 3; l++) {
    const wx = laneX(l, LABEL_WY), wy = sy(LABEL_WY);
    const bw = 76, bh = 30, br = 7;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    rrect(wx-bw/2+2, wy-bh/2+3, bw, bh, br); ctx.fill();
    ctx.fillStyle = '#0e2a5a'; ctx.strokeStyle = '#4488ff'; ctx.lineWidth = 2.5;
    rrect(wx-bw/2, wy-bh/2, bw, bh, br); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Segoe UI';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(q.a[l], wx, wy);
  }
}

function drawCar() {
  ctx.save();
  ctx.translate(carVisX, sy(carWY));
  ctx.rotate(carAngle);

  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath(); ctx.ellipse(2, 0, 16, 42, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#111';
  ctx.fillRect(-24,8,10,14); ctx.fillRect(14,8,10,14);
  ctx.fillRect(-19,-26,8,10); ctx.fillRect(11,-26,8,10);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.fillRect(-24,9,3,12); ctx.fillRect(21,9,3,12);
  ctx.fillRect(-19,-25,2,8); ctx.fillRect(17,-25,2,8);

  ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-11,-22); ctx.lineTo(-19,-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11,-22);  ctx.lineTo(19,-22);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-11,15);  ctx.lineTo(-20,15);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11,15);   ctx.lineTo(20,15);   ctx.stroke();

  ctx.fillStyle = '#aa0010';
  ctx.beginPath(); ctx.moveTo(-18,-34); ctx.lineTo(18,-34); ctx.lineTo(13,-28); ctx.lineTo(-13,-28); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.beginPath(); ctx.moveTo(-17,-34); ctx.lineTo(1,-34); ctx.lineTo(-2,-28); ctx.lineTo(-12,-28); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#770008';
  ctx.fillRect(-20,-35,4,8); ctx.fillRect(16,-35,4,8);

  ctx.fillStyle = '#cc1020';
  ctx.beginPath(); ctx.moveTo(-5,-28); ctx.lineTo(5,-28); ctx.lineTo(2,-41); ctx.lineTo(-2,-41); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#cc1020';
  ctx.beginPath();
  ctx.moveTo(-13,-28); ctx.bezierCurveTo(-14,-20,-14,0,-12,22);
  ctx.lineTo(12,22); ctx.bezierCurveTo(14,0,14,-20,13,-28);
  ctx.closePath(); ctx.fill();
  const gB = ctx.createLinearGradient(-13,0,13,0);
  gB.addColorStop(0,'rgba(255,255,255,.22)'); gB.addColorStop(.35,'rgba(255,255,255,.06)'); gB.addColorStop(1,'rgba(0,0,0,.20)');
  ctx.fillStyle = gB;
  ctx.beginPath();
  ctx.moveTo(-13,-28); ctx.bezierCurveTo(-14,-20,-14,0,-12,22);
  ctx.lineTo(12,22); ctx.bezierCurveTo(14,0,14,-20,13,-28);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = 'rgba(100,0,0,.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,-28); ctx.lineTo(0,22); ctx.stroke();

  ctx.fillStyle = '#b0000c';
  ctx.beginPath(); ctx.moveTo(-13,-8); ctx.bezierCurveTo(-20,-6,-20,12,-13,16); ctx.lineTo(-11,16); ctx.lineTo(-11,-8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13,-8);  ctx.bezierCurveTo(20,-6,20,12,13,16);   ctx.lineTo(11,16);  ctx.lineTo(11,-8);  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = '#777'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-6,-12); ctx.bezierCurveTo(-6,-4,6,-4,6,-12); ctx.stroke();
  ctx.strokeStyle = '#999'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,-4); ctx.stroke();

  ctx.fillStyle = '#0d0d1a';
  ctx.beginPath(); ctx.ellipse(0,-6,4.5,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e0e0e0';
  ctx.beginPath(); ctx.ellipse(0,-7,3,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(80,160,255,.85)';
  ctx.beginPath(); ctx.ellipse(0,-6.5,2.8,1.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.ellipse(-1,-7,1,0.7,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = '#aa0010';
  ctx.beginPath(); ctx.moveTo(-17,24); ctx.lineTo(17,24); ctx.lineTo(15,31); ctx.lineTo(-15,31); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.moveTo(-16,24); ctx.lineTo(1,24); ctx.lineTo(-1,31); ctx.lineTo(-14,31); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#770008';
  ctx.fillRect(-18,23,3,10); ctx.fillRect(15,23,3,10);
  ctx.fillStyle = '#bb0010';
  ctx.beginPath(); ctx.moveTo(-15,32); ctx.lineTo(15,32); ctx.lineTo(13,36); ctx.lineTo(-13,36); ctx.closePath(); ctx.fill();

  ctx.fillStyle = 'rgba(255,100,0,.30)';
  ctx.beginPath(); ctx.ellipse(0,37,5,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#444';
  ctx.beginPath(); ctx.ellipse(0,36,2.5,1.5,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = '#fffde0';
  ctx.fillRect(-5,-41,4,1.5); ctx.fillRect(1,-41,4,1.5);
  ctx.fillStyle = '#ff2200';
  ctx.beginPath(); ctx.ellipse(0,36,4,1.5,0,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

function rrect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

window.addEventListener('keydown', e => {
  if (!driving || carWY > FORK) return;
  if (e.key==='ArrowLeft'  && carLane>0) carLane--;
  if (e.key==='ArrowRight' && carLane<2) carLane++;
});
let tx0 = null;
cv.addEventListener('touchstart', e => { tx0=e.touches[0].clientX; },{passive:true});
cv.addEventListener('touchend', e => {
  if (!driving||carWY>FORK||tx0===null) return;
  const dx = e.changedTouches[0].clientX - tx0;
  if (dx<-28&&carLane>0) carLane--;
  if (dx>28 &&carLane<2) carLane++;
  tx0=null;
});

function showResult() {
  const q   = qs[qi];
  const win = carLane === q.c;
  if (win) score++;
  document.getElementById('sc').textContent = score;

  const mb   = document.getElementById('mb');
  const mbtn = document.getElementById('mbtn');
  const mt   = document.getElementById('mt');

  if (score >= 10) {
    document.getElementById('mi').textContent = '🏆';
    mt.textContent = 'Gewonnen!';
    mt.style.color = '#ffd700';
    document.getElementById('mx').textContent = q.e;
    mb.style.border   = '3px solid #ffd700';
    mbtn.style.background = '#b8860b';
    mbtn.textContent  = 'Nochmal 🔄';
  } else if (win) {
    document.getElementById('mi').textContent = '✅';
    mt.textContent = 'Richtig!';
    mt.style.color = '#33ff77';
    document.getElementById('mx').textContent = q.e;
    mb.style.border   = '3px solid #33ff77';
    mbtn.style.background = '#1a7a3a';
    mbtn.textContent  = 'Weiter →';
  } else {
    document.getElementById('mi').textContent = '❌';
    mt.textContent = 'Leider falsch!';
    mt.style.color = '#ff4444';
    document.getElementById('mx').textContent = `Richtig wäre: ${q.a[q.c]} — denn ${q.e}`;
    mb.style.border   = '3px solid #e94560';
    mbtn.style.background = '#e94560';
    mbtn.textContent  = 'Weiter →';
  }
  document.getElementById('ov').classList.add('on');
}

function nextQ() {
  document.getElementById('ov').classList.remove('on');
  if (score>=10) { score=0; qi=0; qs=shuffle(QS); document.getElementById('sc').textContent='0'; }
  else qi=(qi+1)%qs.length;
  setTimeout(beginRound,60);
}

window.addEventListener('load', () => { resize(); init(); });
</script>
